<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Four ablations</title><desc id="d">Four structural comparisons: remove RMSNorm, pre-norm versus post-norm, RoPE versus no position embedding, and SwiGLU versus plain SiLU FFN.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Four ablations — change one thing, keep everything else</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Structural sketches of what changes in each comparison (not results).</text><rect x="30" y="80" width="410" height="150" rx="12" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="44" y="102" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">1 · REMOVE RMSNORM</text><text x="44" y="126" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">baseline</text><rect x="44" y="136" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">RMSNorm</text><rect x="44" y="166" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sublayer</text><rect x="44" y="196" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">+ x</text><text x="244" y="126" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">ablation</text><rect x="244" y="136" width="180" height="24" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="334" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#a7a39e">removed</text><rect x="244" y="166" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="334" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sublayer</text><rect x="244" y="196" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="334" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">+ x</text><rect x="460" y="80" width="410" height="150" rx="12" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="474" y="102" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">2 · PRE-NORM VS POST-NORM</text><text x="474" y="126" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">pre-norm (baseline)</text><rect x="474" y="136" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">RMSNorm</text><rect x="474" y="166" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sublayer</text><rect x="474" y="196" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">+ x</text><text x="674" y="126" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">post-norm</text><rect x="674" y="136" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sublayer</text><rect x="674" y="166" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">+ x</text><rect x="674" y="196" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">RMSNorm</text><rect x="30" y="246" width="410" height="150" rx="12" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="44" y="268" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">3 · ROPE VS NOPE</text><text x="44" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">RoPE</text><rect x="44" y="302" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">q, k</text><rect x="44" y="332" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="348" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">rotate by pos</text><rect x="44" y="362" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="134" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">attention</text><text x="244" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">NoPE</text><rect x="244" y="302" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="334" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">q, k</text><rect x="244" y="332" width="180" height="24" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="334" y="348" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#a7a39e">removed</text><rect x="244" y="362" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="334" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">attention</text><rect x="460" y="246" width="410" height="150" rx="12" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="474" y="268" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">4 · SWIGLU VS SILU FFN</text><text x="474" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">SwiGLU</text><rect x="474" y="302" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">W₁, W₃ (gate)</text><rect x="474" y="332" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="348" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">SiLU ⊙</text><rect x="474" y="362" width="180" height="24" rx="5" fill="#dde3e0" stroke="none" stroke-width="0"/><text x="564" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">W₂</text><text x="674" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">SiLU FFN</text><rect x="674" y="302" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">W₁ (wider)</text><rect x="674" y="332" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="348" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">SiLU</text><rect x="674" y="362" width="180" height="24" rx="5" fill="#f2e7d7" stroke="none" stroke-width="0"/><text x="764" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">W₂</text></svg>
