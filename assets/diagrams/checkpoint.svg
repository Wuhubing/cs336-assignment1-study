<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Resume faithfully</title><desc id="d">A checkpoint restores more than learned weights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Resume faithfully</text><rect x="40" y="105" width="220" height="90" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="150.0" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Model state</text><rect x="340" y="105" width="220" height="90" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="450.0" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">AdamW state</text><rect x="640" y="105" width="220" height="90" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="750.0" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Iteration</text><path d="M150 205L450 265" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 205L450 265" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 205L450 265" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="265" width="200" height="55" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="450.0" y="295" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Checkpoint</text></svg>