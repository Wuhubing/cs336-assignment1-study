<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">What a checkpoint contains</title><desc id="d">A checkpoint bundles model weights, optimizer state with m, v and step, and the iteration number; loading all three resumes the same run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="360" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="358" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">A checkpoint is a snapshot of the process, not just the model</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Save all three; load all three; the run continues as if it never stopped.</text><rect x="300" y="84" width="300" height="200" rx="14" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="318" y="108" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">CHECKPOINT.PT</text><rect x="318" y="122" width="264" height="42" rx="7" fill="#e0e7ed" stroke="none" stroke-width="0"/><text x="332" y="140" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">model.state_dict()</text><text x="332" y="156" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">weights θ</text><rect x="318" y="174" width="264" height="42" rx="7" fill="#f4ebdd" stroke="none" stroke-width="0"/><text x="332" y="192" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">optimizer.state_dict()</text><text x="332" y="208" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">m, v per parameter + step</text><rect x="318" y="226" width="264" height="42" rx="7" fill="#e3e8e5" stroke="none" stroke-width="0"/><text x="332" y="244" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#426550">iteration</text><text x="332" y="260" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">int t → schedule, logs</text><rect x="40" y="150" width="180" height="60" rx="7" fill="#f2f1ef" stroke="none" stroke-width="1.5"/><text x="130" y="184" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">training at step t</text><path d="M222 180L296 180" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="259" y="170" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">save</text><rect x="680" y="150" width="190" height="60" rx="7" fill="#e3ece6" stroke="none" stroke-width="1.5"/><text x="775" y="180" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#426550">resume at step t</text><text x="775" y="196" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">same LR, same moments</text><path d="M604 180L676 180" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="170" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">load</text><rect x="40" y="300" width="830" height="44" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="58" y="327" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Weights only? You can sample, but a resumed run restarts warmup and loses AdamW’s moments.</text></svg>
