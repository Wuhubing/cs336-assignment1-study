<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Embedding lookup versus linear map</title><desc id="d">An embedding table of vocab by d_model rows is indexed by a token ID to return one row; a linear layer multiplies a feature vector by a d_out by d_in matrix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Embedding = pick a row.  Linear = multiply.</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Same kind of parameter (a matrix), different operation. Values are illustrative.</text><text x="30" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">EMBEDDING TABLE (VOCAB, D_MODEL)</text><text x="46" y="129" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">0</text><rect x="56" y="110" width="40" height="26" rx="3" fill="#f7f6f6" stroke="none" stroke-width="0"/><text x="76" y="127" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.2</text><rect x="98" y="110" width="40" height="26" rx="3" fill="#efeeed" stroke="none" stroke-width="0"/><text x="118" y="127" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" fon