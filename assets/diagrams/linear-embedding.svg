<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Two parameter tables</title><desc id="d">A linear map transforms features; an embedding indexes a row.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Two parameter tables</text><rect x="60" y="105" width="340" height="125" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="230.0" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Embedding E</text><text x="230.0" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">token ID → selected row</text><rect x="500" y="105" width="340" height="125" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="670.0" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Linear W</text><text x="670.0" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">input vector → output vector</text><text x="450" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8c1515">E: vocab × d_model        W: d_out × d_in</text></svg>