40" height="26" rx="3" fill="#f7f6f6" stroke="none" stroke-width="0"/><text x="202" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">-0.2</text><rect x="224" y="140" width="40" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="244" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.0</text><rect x="266" y="140" width="40" height="26" rx="3" fill="#efeeed" stroke="none" stroke-width="0"/><text x="286" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.4</text><text x="46" y="189" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">2</text><rect x="56" y="170" width="40" height="26" rx="3" fill="#fbfbfa" stroke="none" stroke-width="0"/><text x="76" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.1</text><rect x="98" y="170" width="40" height="26" rx="3" fill="#dad8d5" stroke="none" stroke-width="0"/><text x="118" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.9</text><rect x="140" y="170" width="40" height="26" rx="3" fill="#f3f2f1" stroke="none" stroke-width="0"/><text x="160" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">-0.3</text><rect x="182" y="170" width="40" height="26" rx="3" fill="#f7f6f6" stroke="none" stroke-width="0"/><text x="202" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.2</text><rect x="224" y="170" width="40" height="26" rx="3" fill="#e6e5e3" stroke="none" stroke-width="0"/><text x="244" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.6</text><rect x="266" y="170" width="40" height="26" rx="3" fill="#e2e0df" stroke="none" stroke-width="0"/><text x="286" y="187" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">-0.7</text><text x="46" y="219" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">3</text><rect x="56" y="200" width="40" height="26" rx="3" fill="#e3c7c7" stroke="#8c1515" stroke-width="2"/><text x="76" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.4</text><rect x="98" y="200" width="40" height="26" rx="3" fill="#f3f5f8" stroke="#8c1515" stroke-width="2"/><text x="118" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-0.1</text><rect x="140" y="200" width="40" height="26" rx="3" fill="#dcb9b9" stroke="#8c1515" stroke-width="2"/><text x="160" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.5</text><rect x="182" y="200" width="40" height="26" rx="3" fill="#ead5d5" stroke="#8c1515" stroke-width="2"/><text x="202" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.3</text><rect x="224" y="200" width="40" height="26" rx="3" fill="#b4c5d5" stroke="#8c1515" stroke-width="2"/><text x="244" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-0.6</text><rect x="266" y="200" width="40" height="26" rx="3" fill="#f1e3e3" stroke="#8c1515" stroke-width="2"/><text x="286" y="217" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.2</text><text x="46" y="249" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">…</text><rect x="56" y="230" width="40" height="26" rx="3" fill="#f7f6f6" stroke="none" stroke-width="0"/><text x="76" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">-0.2</text><rect x="98" y="230" width="40" height="26" rx="3" fill="#e6e5e3" stroke="none" stroke-width="0"/><text x="118" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.6</text><rect x="140" y="230" width="40" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="160" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.0</text><rect x="182" y="230" width="40" height="26" rx="3" fill="#efeeed" stroke="none" stroke-width="0"/><text x="202" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">-0.4</text><rect x="224" y="230" width="40" height="26" rx="3" fill="#f3f2f1" stroke="none" stroke-width="0"/><text x="244" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.3</text><rect x="266" y="230" width="40" height="26" rx="3" fill="#fbfbfa" stroke="none" stroke-width="0"/><text x="286" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#282827">+0.1</text><rect x="340" y="200" width="110" height="30" rx="5" fill="#8c1515" stroke="none" stroke-width="0"/><text x="395" y="219.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#ffffff">token ID 3</text><path d="M338 215L312 215" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="252" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">→ returns row 3:</text><text x="340" y="268" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">a d_model vector</text><text x="56" y="330" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">No multiplication happens: indexing W_emb[ids] is</text><text x="56" y="346" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">equivalent to one_hot(id) · W_emb, but far cheaper.</text><text x="520" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">LINEAR W (D_OUT, D_IN), NO BIAS</text><rect x="520" y="112" width="150" height="110" rx="4" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="595" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#8c1515">W</text><text x="686" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#282827">·</text><rect x="704" y="112" width="26" height="110" rx="4" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.5"/><text x="717" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">x</text><text x="748" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#282827">=</text><rect x="768" y="128" width="26" height="78" rx="4" fill="#e3ece6" stroke="#426550" stroke-width="1.5"/><text x="781" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#426550">y</text><text x="595" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">(d_out, d_in)</text><text x="717" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">d_in</text><text x="781" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#426550">d_out</text><rect x="520" y="270" width="350" height="84" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="538" y="294" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">Build both from nn.Parameter yourself —</text><text x="538" y="312" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">the assignment forbids nn.Linear, nn.Embedding</text><text x="538" y="330" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">and their functional versions for these parts.</text></svg>
