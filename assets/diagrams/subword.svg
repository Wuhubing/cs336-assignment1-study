<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">The vocabulary tradeoff</title><desc id="d">Moving from bytes toward words changes sequence length and vocabulary size.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">The vocabulary tradeoff</text><rect x="55" y="112" width="220" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="165.0" y="142" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Bytes</text><rect x="340" y="112" width="220" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="450.0" y="142" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Subwords</text><path d="M280 150L333 150" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="112" width="220" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="735.0" y="142" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Words</text><path d="M565 150L618 150" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="165" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#50705f">small vocabulary</text><text x="450" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#8c1515">balanced</text><text x="735" y="255" text-anchor="middle" 