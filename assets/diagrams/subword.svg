<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Bytes, subwords, words</title><desc id="d">The word unbelievably tokenized as 12 bytes, 3 subwords, or 1 word; sequence length falls as vocabulary size grows, and word vocabularies cannot represent unseen words.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="360" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="358" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Three ways to cut “ unbelievably”</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Subwords trade a bigger vocabulary for shorter sequences — and still cover any text.</text><text x="30" y="106" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">bytes</text><text x="30" y="124" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">never out-of-vocabulary</text><rect x="190" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="205" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">␠</text><rect x="224" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="239" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">u</text><rect x="258" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="273" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">n</text><rect x="292" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="307" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">b</text><rect x="326" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="341" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">e</text><rect x="360" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="375" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">l</text><rect x="394" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="409" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">i</text><rect x="428" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="443" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">e</text><rect x="462" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="477" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">v</text><rect x="496" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="511" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">a</text><rect x="530" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="545" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">b</text><rect x="564" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="579" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">l</text><rect x="598" y="88" width="30" height="36" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="613" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">y</text><text x="700" y="104" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">13 tokens</text><text x="700" y="122" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">vocab 256</text><text x="30" y="192" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">subwords (BPE)</text><text x="30" y="210" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">falls back to bytes</text><rect x="190" y="174" width="42.5" height="36" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="211.25" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">␠un</text><rect x="236.5" y="174" width="74" height="36" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="273.5" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">believ</text><rect x="314.5" y="174" width="53" height="36" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="341" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">ably</text><text x="700" y="190" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">3 tokens</text><text x="700" y="208" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">vocab ≈ 10K–50K</text><text x="30" y="278" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#b7791f">whole words</text><text x="30" y="296" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">unseen word → &lt;unk&gt;</text><rect x="190" y="260" width="147.5" height="36" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="263.75" y="284" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">␠unbelievably</text><text x="700" y="276" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">1 token</text><text x="700" y="294" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">vocab 100K+</text><path d="M660 90 L660 300" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="30" y="348" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">␠ marks the leading space, which BPE usually keeps attached to the following word.</text></svg>
