<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Pre-norm block and parameter accounting</title><desc id="d">A pre-norm Transformer block with two residual additions, stacked L times, and where each group of parameters lives.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Assemble the LM — and know where every parameter lives</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Pre-norm: normalize the input of each sublayer, then add its output back to the residual stream.</text><rect x="40" y="80" width="300" height="300" rx="12" fill="#faf7f2" stroke="#ded9d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="54" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">BLOCK × L</text><path d="M90 370L90 100" fill="none" stroke="#8c1515" stroke-width="3"/><text x="82" y="370" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">x</text><rect x="150" y="316" width="150" height="32" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="225" y="337" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">RMSNorm</text><rect x="150" y="270" width="150" height="32" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="225" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">causal MHA</text><rect x="150" y="196" width="150" height="32" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="225" y="217" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">RMSNorm</text><rect x="150" y="150" width="150" height="32" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="225" y="171" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">SwiGLU FFN</text><path d="M90 350 L225 350 L225 348" fill="none" stroke="#8c1515" stroke-width="1.4"/><path d="M225 316L225 304" fill="none" stroke="#746d67" stroke-width="1.2"/><path d="M225 270 L225 244 L104 244" fill="none" stroke="#8c1515" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="90" cy="244" r="11" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="90" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">+</text><path d="M90 230 L225 230 L225 228" fill="none" stroke="#8c1515" stroke-width="1.4"/><path d="M225 150 L225 124 L104 124" fill="none" stroke="#8c1515" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="90" cy="124" r="11" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="90" y="129" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">+</text><text x="400" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">PARAMETER COUNT (D = D_MODEL)</text><rect x="400" y="114" width="470" height="28" rx="4" fill="#fffdfa" stroke="none" stroke-width="0"/><text x="414" y="133" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">token embedding</text><text x="856" y="133" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">V · d</text><rect x="400" y="148" width="470" height="28" rx="4" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="414" y="167" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">per block: W_Q, W_K, W_V, W_O</text><text x="856" y="167" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">4 · d²</text><rect x="400" y="182" width="470" height="28" rx="4" fill="#fffdfa" stroke="none" stroke-width="0"/><text x="414" y="201" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">per block: W₁, W₂, W₃</text><text x="856" y="201" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">3 · d · d_ff</text><rect x="400" y="216" width="470" height="28" rx="4" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="414" y="235" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">per block: two RMSNorm gains</text><text x="856" y="235" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">2 · d</text><rect x="400" y="250" width="470" height="28" rx="4" fill="#fffdfa" stroke="none" stroke-width="0"/><text x="414" y="269" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">final RMSNorm</text><text x="856" y="269" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">d</text><rect x="400" y="284" width="470" height="28" rx="4" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="414" y="303" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">LM head</text><text x="856" y="303" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">d · V</text><text x="414" y="344" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">total ≈ 2·V·d + L·(4d² + 3·d·d_ff + 2d) + d</text><text x="414" y="368" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">FLOPs of a matmul (m×n)(n×p) ≈ 2mnp. Plug in the handout’s sizes yourself.</text></svg>
