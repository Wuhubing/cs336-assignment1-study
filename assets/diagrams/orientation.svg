<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">The whole assignment on one page</title><desc id="d">Text becomes token IDs, the Transformer produces logits, loss and AdamW update weights in a loop, and decoding turns IDs back into text.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">The whole assignment on one page</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Follow one sentence through everything you will build. Numbers are illustrative.</text><rect x="30" y="86" width="130" height="66" rx="10" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="95" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">raw text</text><text x="95" y="136" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#2f5d8a">“Once upon a time”</text><rect x="210" y="86" width="130" height="66" rx="10" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="275" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">BPE tokenizer</text><text x="275" y="136" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">§2</text><rect x="390" y="86" width="130" height="66" rx="10" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="455" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">token IDs</text><text x="455" y="136" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#2f5d8a">[7454, 2402, 257, 640]</text><rect x="570" y="86" width="130" height="66" rx="10" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="635" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">Transformer LM</text><text x="635" y="136" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">§3</text><rect x="750" y="86" width="130" height="66" rx="10" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="815" y="114" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">logits</text><text x="815" y="136" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#2f5d8a">(B, T, |V|)</text><path d="M164 119L206 119" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M344 119L386 119" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M524 119L566 119" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M704 119L746 119" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M815 156 L815 212 L665 212" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="190" width="160" height="46" rx="8" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="585" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">cross-entropy loss</text><text x="585" y="227" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">§4.1</text><path d="M505 213L455 213" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="190" width="160" height="46" rx="8" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="375" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">AdamW + schedule</text><text x="375" y="227" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">§4.2–4.4</text><path d="M375 190 L375 170 L635 170 L635 156" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="5 4"/><text x="505" y="165" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">update weights, repeat</text><text x="30" y="206" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">TRAINING LOOP  §5</text><text x="30" y="226" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">batches · checkpoints · logs</text><rect x="30" y="262" width="840" height="58" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="48" y="284" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">THEN GENERATE  §6</text><text x="48" y="306" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">prompt → last logits → sample → append → repeat →  “Once upon a time there was a little fox …”</text><rect x="30" y="334" width="840" height="48" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="355" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">FINALLY MEASURE  §7</text><text x="48" y="373" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">TinyStories baseline · learning-rate sweeps · four ablations · OpenWebText · writeup.pdf + code.zip</text></svg>
