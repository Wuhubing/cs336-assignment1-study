<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="title description">
  <title id="title">Assignment 1 system architecture</title>
  <desc id="description">Raw text is tokenized by byte-level BPE into token arrays. Batches enter a Transformer to produce logits. A training loop uses loss and AdamW to update the model; a generation path samples logits into decoded text. The guide covers 31 lessons, 38 Problems, and 29 numbered equations.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c1515"/></marker></defs>
  <rect x="1" y="1" width="958" height="443" rx="13" fill="#faf8f5" stroke="#e4e1dc" stroke-width="2"/>
  <text x="30" y="39" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#8c1515">ASSIGNMENT 1 / SYSTEM MAP</text>
  <text x="30" y="68" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242424">The output of one stage becomes the input of the next.</text>
  <g font-family="Arial,sans-serif">
    <g><rect x="30" y="98" width="200" height="120" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><rect x="30" y="98" width="200" height="4" fill="#8c1515"/><text x="46" y="122" font-size="10" font-weight="700" fill="#8c1515">01  SOURCE</text><text x="46" y="153" font-size="18" font-weight="700" fill="#242424">Raw text</text><text x="46" y="177" font-size="12" fill="#686664">documents and splits</text><text x="46" y="202" font-size="11" font-weight="700" fill="#426550">OUT  UTF-8 bytes</text></g>
    <g><rect x="265" y="98" width="200" height="120" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><rect x="265" y="98" width="200" height="4" fill="#8c1515"/><text x="281" y="122" font-size="10" font-weight="700" fill="#8c1515">02  TOKENIZER</text><text x="281" y="153" font-size="18" font-weight="700" fill="#242424">Byte-level BPE</text><text x="281" y="177" font-size="12" fill="#686664">learn ordered merges</text><text x="281" y="202" font-size="11" font-weight="700" fill="#426550">OUT  vocab + merges</text></g>
    <g><rect x="500" y="98" width="200" height="120" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><rect x="500" y="98" width="200" height="4" fill="#8c1515"/><text x="516" y="122" font-size="10" font-weight="700" fill="#8c1515">03  DATA</text><text x="516" y="153" font-size="18" font-weight="700" fill="#242424">Token IDs</text><text x="516" y="177" font-size="12" fill="#686664">train / validation arrays</text><text x="516" y="202" font-size="11" font-weight="700" fill="#426550">OUT  windows (B, T)</text></g>
    <g><rect x="735" y="98" width="195" height="120" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><rect x="735" y="98" width="195" height="4" fill="#8c1515"/><text x="751" y="122" font-size="10" font-weight="700" fill="#8c1515">04  MODEL</text><text x="751" y="153" font-size="18" font-weight="700" fill="#242424">Transformer</text><text x="751" y="177" font-size="12" fill="#686664">embedding → blocks → head</text><text x="751" y="202" font-size="11" font-weight="700" fill="#426550">OUT  logits (B, T, V)</text></g>
    <path d="M233 158H257" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M468 158H492" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M703 158H727" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/>
    <g><rect x="30" y="251" width="435" height="123" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><text x="46" y="279" font-size="11" font-weight="700" letter-spacing="1" fill="#8c1515">TRAINING LOOP  ↺ MODEL WEIGHTS</text><text x="46" y="309" font-size="15" font-weight="700" fill="#242424">batch + targets → loss → gradients → AdamW</text><text x="46" y="336" font-size="12" fill="#686664">Validation and checkpoints record the evolving run.</text><rect x="46" y="348" width="116" height="4" rx="2" fill="#8c1515"/><rect x="167" y="348" width="88" height="4" rx="2" fill="#c4a5a0"/><rect x="260" y="348" width="144" height="4" rx="2" fill="#e8ddd9"/></g>
    <g><rect x="495" y="251" width="435" height="123" rx="8" fill="#fff" stroke="#ded9d2" stroke-width="2"/><text x="511" y="279" font-size="11" font-weight="700" letter-spacing="1" fill="#426550">GENERATION PATH  → TEXT</text><text x="511" y="309" font-size="15" font-weight="700" fill="#242424">prompt → last logits → sample → decode</text><text x="511" y="336" font-size="12" fill="#686664">Temperature and top-p shape the next-token choice.</text><rect x="511" y="348" width="132" height="4" rx="2" fill="#426550"/><rect x="648" y="348" width="78" height="4" rx="2" fill="#a6b5a9"/><rect x="731" y="348" width="150" height="4" rx="2" fill="#e0e9e1"/></g>
    <text x="30" y="413" font-size="11" font-weight="700" fill="#686664">31 LESSONS</text><text x="165" y="413" font-size="11" font-weight="700" fill="#686664">38 PROBLEMS</text><text x="315" y="413" font-size="11" font-weight="700" fill="#686664">29 EQUATIONS</text><text x="484" y="413" font-size="11" fill="#686664">Build → test → train → compare → submit</text>
  </g>
</svg>
