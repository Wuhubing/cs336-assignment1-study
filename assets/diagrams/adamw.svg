<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">AdamW update</title><desc id="d">The gradient updates two moving averages, m of gradients and v of squared gradients; bias correction adjusts the step; the update divides m by the square root of v; weight decay shrinks parameters separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">AdamW keeps two running memories per parameter</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">All of m, v, θ have the parameter’s shape. The step is m / (√v + ε), scaled by a bias-corrected α_t.</text><rect x="30" y="170" width="110" height="56" rx="7" fill="#e2eaf3" stroke="none" stroke-width="1.5"/><text x="85" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">gradient g_t</text><text x="85" y="214" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">∇L on this batch</text><path d="M140 190 L180 190 L180 124 L210 124" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M140 206 L180 206 L180 272 L210 272" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="214" y="96" width="210" height="56" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="319" y="124" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">m_t = β₁m + (1−β₁)g</text><text x="319" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">direction (1st moment)</text><rect x="214" y="244" width="210" height="56" rx="7" fill="#f6ead3" stroke="#b7791f" stroke-width="1.5"/><text x="319" y="272" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#b7791f">v_t = β₂v + (1−β₂)g²</text><text x="319" y="288" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">magnitude (2nd moment)</text><path d="M424 124 L470 124 L470 180 L500 180" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M424 272 L470 272 L470 216 L500 216" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="504" y="160" width="190" height="76" rx="10" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="599" y="188" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">θ −= α_t · m/(√v+ε)</text><text x="599" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">adaptive step</text><text x="599" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">α_t includes bias correction</text><path d="M694 198L736 198" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="160" width="130" height="76" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="805" y="190" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">θ −= αλθ</text><text x="805" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">decoupled weight</text><text x="805" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">decay (the “W”)</text><rect x="30" y="322" width="840" height="56" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="345" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">Memory: parameters + gradients + m + v ≈ 4 × parameter count in float32.</text><text x="48" y="364" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">State must be saved in checkpoints: m, v and the step count t (for bias correction and the schedule).</text></svg>
