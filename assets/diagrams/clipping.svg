<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Global gradient-norm clipping</title><desc id="d">All parameter gradients form one long vector; if its L2 norm exceeds M it is scaled down onto the circle of radius M, keeping its direction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Clip the whole gradient, not each piece</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Concatenate every parameter’s gradient into one vector g; if ‖g‖ &gt; M, scale all of it by M / ‖g‖.</text><text x="30" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">1 · ONE VECTOR FROM ALL PARAMETERS</text><rect x="30" y="110" width="20" height="26" rx="3" fill="#a1b6ca" stroke="none" stroke-width="0"/><rect x="52" y="110" width="20" height="26" rx="3" fill="#a1b6ca" stroke="none" stroke-width="0"/><rect x="74" y="110" width="20" height="26" rx="3" fill="#a1b6ca" stroke="none" stroke-width="0"/><rect x="96" y="110" width="20" height="26" rx="3" fill="#a1b6ca" stroke="none" stroke-width="0"/><rect x="118" y="110" width="20" height="26" rx="3" fill="#a1b6ca" stroke="none" stroke-width="0"/><text x="85" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#2f5d8a">W_emb</text><rect x="140" y="110" width="20" height="26" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><rect x="162" y="110" width="20" height="26" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><rect x="184" y="110" width="20" height="26" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><rect x="206" y="110" width="20" height="26" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><text x="184" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">W_Q…W_O</text><rect x="228" y="110" width="20" height="26" rx="3" fill="#dfc39a" stroke="none" stroke-width="0"/><rect x="250" y="110" width="20" height="26" rx="3" fill="#dfc39a" stroke="none" stroke-width="0"/><rect x="272" y="110" width="20" height="26" rx="3" fill="#dfc39a" stroke="none" stroke-width="0"/><rect x="294" y="110" width="20" height="26" rx="3" fill="#dfc39a" stroke="none" stroke-width="0"/><text x="272" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#b7791f">W₁ W₂ W₃</text><rect x="316" y="110" width="20" height="26" rx="3" fill="#aabab0" stroke="none" stroke-width="0"/><rect x="338" y="110" width="20" height="26" rx="3" fill="#aabab0" stroke="none" stroke-width="0"/><text x="338" y="152" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#426550">g (norms)</text><text x="30" y="190" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">‖g‖₂ = √(Σ over every parameter,</text><text x="30" y="208" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">       every entry of g²)</text><text x="30" y="240" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">Parameters with grad = None</text><text x="30" y="255" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">are skipped.</text><text x="470" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">2 · RESCALE ONTO THE BALL OF RADIUS M</text><circle cx="640" cy="230" r="100" fill="#e3ece6" stroke="#426550" stroke-width="1.5"/><text x="548" y="324" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">‖g‖ ≤ M</text><path d="M640 230 L787.4 126.8" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="793.447" y="126.756" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">g  (‖g‖ = 1.8 M)</text><path d="M640 230 L719.5 174.4" fill="none" stroke="#8c1515" stroke-width="3.5" marker-end="url(#arrow)"/><text x="680" y="224" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">g · M/‖g‖</text><path d="M640 230 L581.7 208.8" fill="none" stroke="#2f5d8a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="575.739" y="200.795" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#2f5d8a">small g: unchanged</text></svg>
