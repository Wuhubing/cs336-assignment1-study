<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Preserve direction, cap length</title><desc id="d">Global norm clipping rescales the complete gradient vector.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Preserve direction, cap length</text><circle cx="155" cy="225" r="7" fill="#282827"/><path d="M155 225L690 75" fill="none" stroke="#8c1515" stroke-width="4" marker-end="url(#arrow)"/><path d="M155 225L460 139" fill="none" stroke="#50705f" stroke-width="4" marker-end="url(#arrow)"/><path d="M460 139A320 320 0 0 0 441 80" stroke="#ded9d2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#8c1515">original</text><text x="476" y="135" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#50705f">clipped</text><text x="450" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#746d67">one scale factor for all gradient entries</text></svg>