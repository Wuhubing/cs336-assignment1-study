<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">One map, two notations</title><desc id="d">Rows and columns describe the same learned transformation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">One map, two notations</text><rect x="55" y="93" width="330" height="150" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="220.0" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">row vectors</text><text x="220.0" y="149" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">x Wᵀ → y</text><rect x="515" y="93" width="330" height="150" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="680.0" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">column vectors</text><text x="680.0" y="149" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">W x → y</text><path d="M395 168L505 168" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#746d67">Track feature axes, not the typography alone.</text></svg>