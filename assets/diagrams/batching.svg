<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Two notations for one linear map</title><desc id="d">The handout writes y = W x with column vectors; PyTorch code computes y = x W transpose with features on the last axis. W is d_out by d_in in both.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">y = Wx (handout) and y = xWᵀ (PyTorch) are the same map</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">W is stored as (d_out, d_in) in both. Only the side the vector sits on changes.</text><text x="30" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">MATH: COLUMN VECTORS</text><rect x="40" y="120" width="110" height="70" rx="4" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="95" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#8c1515">W</text><text x="95" y="206" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">d_out × d_in</text><text x="170" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#282827">·</text><rect x="190" y="110" width="26" height="110" rx="4" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.5"/><text x="203" y="170" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f5d8a">x</text><text x="203" y="236" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">d_in × 1</text><text x="240" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#282827">=</text><rect x="262" y="120" width="26" height="70" rx="4" fill="#e3ece6" stroke="#426550" stroke-width="1.5"/><text x="275" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#426550">y</text><text x="275" y="206" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#426550">d_out × 1</text><text x="400" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">PYTORCH: FEATURES ON THE LAST AXIS</text><rect x="410" y="130" width="110" height="26" rx="4" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.5"/><text x="465" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">x</text><text x="465" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">(…, d_in)</text><text x="540" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#282827">·</text><rect x="560" y="110" width="70" height="110" rx="4" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="595" y="170" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#8c1515">Wᵀ</text><text x="595" y="236" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">d_in × d_out</text><text x="650" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#282827">=</text><rect x="672" y="130" width="70" height="26" rx="4" fill="#e3ece6" stroke="#426550" stroke-width="1.5"/><text x="707" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#426550">y</text><text x="707" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#426550">(…, d_out)</text><rect x="30" y="270" width="840" height="90" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="294" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">SAY IT WITH EINSUM</text><text x="48" y="322" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#282827">einsum(&#x27;... i, o i -&gt; ... o&#x27;, x, W)</text><text x="48" y="344" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">i = d_in is summed away; o = d_out appears; “...” carries batch and sequence axes through untouched.</text></svg>
