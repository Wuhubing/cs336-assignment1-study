<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">RMSNorm step by step</title><desc id="d">A six-feature vector with RMS 1.89 is divided by that single scale and multiplied by a per-feature gain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">RMSNorm: one shared scale, then a per-feature gain</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">No mean subtraction (unlike LayerNorm). Numbers are a toy vector with d_model = 6.</text><text x="30" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">1 · INPUT A</text><path d="M30 220L234 220" fill="none" stroke="#ded9d2" stroke-width="1"/><rect x="34" y="176" width="26" height="44" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="47" y="170" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+2.00</text><rect x="68" y="220" width="26" height="22" rx="3" fill="#7896b3" stroke="none" stroke-width="0"/><text x="81" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-1.00</text><rect x="102" y="154" width="26" height="66" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="115" y="148" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+3.00</text><rect x="136" y="209" width="26" height="11" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="149" y="203" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.50</text><rect x="170" y="220" width="26" height="55" rx="3" fill="#7896b3" stroke="none" stroke-width="0"/><text x="183" y="289" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-2.50</text><rect x="204" y="198" width="26" height="22" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="217" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+1.00</text><path d="M252 220L292 220" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="272" y="206" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">÷ RMS</text><text x="300" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">2 · A / RMS(A)</text><path d="M300 220L504 220" fill="none" stroke="#ded9d2" stroke-width="1"/><rect x="304" y="177.738" width="26" height="42.2616" rx="3" fill="#426550" stroke="none" stroke-width="0"/><text x="317" y="171.738" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+1.06</text><rect x="338" y="220" width="26" height="21.1308" rx="3" fill="#849b8d" stroke="none" stroke-width="0"/><text x="351" y="255.131" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-0.53</text><rect x="372" y="156.608" width="26" height="63.3924" rx="3" fill="#426550" stroke="none" stroke-width="0"/><text x="385" y="150.608" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+1.58</text><rect x="406" y="209.435" width="26" height="10.5654" rx="3" fill="#426550" stroke="none" stroke-width="0"/><text x="419" y="203.435" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.26</text><rect x="440" y="220" width="26" height="52.827" rx="3" fill="#849b8d" stroke="none" stroke-width="0"/><text x="453" y="286.827" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-1.32</text><rect x="474" y="198.869" width="26" height="21.1308" rx="3" fill="#426550" stroke="none" stroke-width="0"/><text x="487" y="192.869" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.53</text><path d="M522 220L562 220" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="542" y="206" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">× g</text><text x="570" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">3 · × GAIN G</text><path d="M570 220L774 220" fill="none" stroke="#ded9d2" stroke-width="1"/><rect x="574" y="177.738" width="26" height="42.2616" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="587" y="171.738" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+1.06</text><rect x="608" y="220" width="26" height="21.1308" rx="3" fill="#b46767" stroke="none" stroke-width="0"/><text x="621" y="255.131" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-0.53</text><rect x="642" y="143.929" width="26" height="76.0709" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="655" y="137.929" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+1.90</text><rect x="676" y="211.548" width="26" height="8.45232" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="689" y="205.548" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.21</text><rect x="710" y="220" width="26" height="52.827" rx="3" fill="#b46767" stroke="none" stroke-width="0"/><text x="723" y="286.827" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">-1.32</text><rect x="744" y="188.304" width="26" height="31.6962" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="757" y="182.304" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#282827">+0.79</text><rect x="30" y="290" width="840" height="70" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="316" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">RMS(a) = √(mean(a²) + ε) = √(3.58 + ε) ≈ 1.89</text><text x="48" y="340" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Computed over d_model only, separately for every (batch, position). g starts at 1 and is learned.</text></svg>
