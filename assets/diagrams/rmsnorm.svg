<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Rescale features</title><desc id="d">All features share an RMS; each has its own learned gain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Rescale features</text><rect x="50" y="108" width="220" height="120" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="160.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">input vector</text><text x="160.0" y="164" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">a₁  a₂  a₃</text><rect x="340" y="108" width="220" height="120" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="450.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">shared RMS</text><text x="450.0" y="164" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">sqrt(mean(a²)+ε)</text><rect x="630" y="108" width="220" height="120" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="740.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">output</text><text x="740.0" y="164" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">scaled by g₁,g₂,g₃</text><path d="M274 168L332 168" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M564 168L622 168" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/></svg>