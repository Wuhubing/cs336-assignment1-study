<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Encode and decode pipeline</title><desc id="d">Encoding splits special tokens, pre-tokenizes, replays merges in rank order and maps to IDs; decoding maps IDs to bytes, concatenates and decodes UTF-8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">encode → IDs → decode</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">A worked toy example with the merges from the previous lesson (IDs are illustrative).</text><text x="30" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">text</text><rect x="170" y="82" width="77" height="28" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="208.5" y="101" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">newest</text><rect x="252" y="82" width="143.5" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="323.75" y="101" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><text x="30" y="144" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">split specials</text><rect x="170" y="126" width="77" height="28" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="208.5" y="145" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">newest</text><rect x="252" y="126" width="143.5" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="323.75" y="145" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><path d="M160 116L160 126" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="30" y="188" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">bytes</text><rect x="170" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="184.75" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">n</text><rect x="204.5" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="219.25" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">e</text><rect x="239" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="253.75" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">w</text><rect x="273.5" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="288.25" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">e</text><rect x="308" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="322.75" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">s</text><rect x="342.5" y="170" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="357.25" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">t</text><rect x="377" y="170" width="143.5" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="448.75" y="189" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><path d="M160 160L160 170" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="30" y="232" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">replay merges</text><rect x="170" y="214" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="184.75" y="233" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">n</text><rect x="204.5" y="214" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="219.25" y="233" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">e</text><rect x="239" y="214" width="29.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="253.75" y="233" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">w</text><rect x="273.5" y="214" width="48.5" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="297.75" y="233" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">est</text><rect x="327" y="214" width="143.5" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="398.75" y="233" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><path d="M160 204L160 214" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="30" y="276" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">… until done</text><rect x="170" y="258" width="77" height="28" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="208.5" y="277" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">newest</text><rect x="252" y="258" width="143.5" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="323.75" y="277" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><path d="M160 248L160 258" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="30" y="320" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">IDs</text><rect x="170" y="302" width="48.5" height="28" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="194.25" y="321" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#426550">262</text><rect x="223.5" y="302" width="29.5" height="28" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="238.25" y="321" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#426550">0</text><path d="M160 292L160 302" fill="none" stroke="#ded9d2" stroke-width="1.5"/><text x="560" y="216" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">merge ranks applied in order:</text><text x="560" y="232" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#746d67">s t → e st → w est → n e → ne west</text><rect x="560" y="90" width="310" height="96" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="578" y="112" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">DECODE</text><text x="578" y="136" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">IDs → vocab bytes → concatenate</text><text x="578" y="156" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">→ bytes.decode(&quot;utf-8&quot;,</text><text x="578" y="172" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">             errors=&quot;replace&quot;)</text><rect x="30" y="348" width="840" height="54" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="370" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Special tokens are matched first and never split. When two special tokens overlap, prefer the longer one</text><text x="48" y="388" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">(e.g. “&lt;|endoftext|&gt;&lt;|endoftext|&gt;” as its own token if it is in the list).</text></svg>
