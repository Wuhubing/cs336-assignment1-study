<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Decoder-only LM shapes</title><desc id="d">Token IDs of shape B by T become embeddings B by T by d_model, pass through L Transformer blocks that keep the shape, then final RMSNorm and the LM head give logits B by T by vocabulary size.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">The whole model is a shape pipeline</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Only the first and last steps change the last axis; every block keeps (B, T, d_model).</text><path d="M30 150 L46 134 L116 134 L100 150 Z" fill="#ecf1f7" stroke="#2f5d8a" stroke-width="1.2"/><path d="M100 150 L116 134 L116 224 L100 240 Z" fill="#cdd9e6" stroke="#2f5d8a" stroke-width="1.2"/><rect x="30" y="150" width="70" height="90" rx="2" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.2"/><text x="65" y="200" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">IDs</text><text x="73" y="258" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">(B, T)</text><path d="M122 190L160 190" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="141" y="180" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">lookup</text><path d="M165 130 L187 108 L277 108 L255 130 Z" fill="#f5edeb" stroke="#8c1515" stroke-width="1.2"/><path d="M255 130 L277 108 L277 228 L255 250 Z" fill="#e4cac8" stroke="#8c1515" stroke-width="1.2"/><rect x="165" y="130" width="90" height="120" rx="2" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.2"/><text x="210" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">embed</text><text x="221" y="268" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">(B, T, d)</text><path d="M284 190L320 190" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="326" y="92" width="300" height="214" rx="12" fill="#faf7f2" stroke="#ded9d2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="340" y="114" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">TRANSFORMER BLOCK × L</text><rect x="344" y="128" width="190" height="30" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="439" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">RMSNorm</text><rect x="344" y="168" width="190" height="30" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="439" y="188" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">causal MHA + RoPE</text><rect x="344" y="208" width="190" height="30" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="439" y="228" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">RMSNorm</text><rect x="344" y="248" width="190" height="30" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="439" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">SwiGLU FFN</text><path d="M574 292L574 112" fill="none" stroke="#8c1515" stroke-width="2.5" marker-end="url(#arrow)"/><text x="586" y="124" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">residual</text><text x="586" y="136" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">stream</text><path d="M536 183L560 183" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="574" cy="183" r="11" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="574" y="188" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">+</text><path d="M536 263L560 263" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="574" cy="263" r="11" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="574" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">+</text><text x="476" y="296" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">shape stays (B, T, d)</text><path d="M632 190L668 190" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="672" y="168" width="74" height="44" rx="7" fill="#e3ece6" stroke="none" stroke-width="1.5"/><text x="709" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">RMSNorm</text><path d="M748 190L766 190" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="768" y="146" width="38" height="88" rx="7" fill="#f0e3e0" stroke="none" stroke-width="1.5"/><text x="787" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827"></text><text x="787" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">LM</text><text x="787" y="208" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">head</text><path d="M808 190L826 190" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="828" y="120" width="44" height="140" rx="3" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.2"/><rect x="832" y="214" width="10" height="32" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="845" y="178" width="10" height="68" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="858" y="226" width="10" height="20" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="832" y="142" width="10" height="104" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="845" y="202" width="10" height="44" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="858" y="220" width="10" height="26" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="832" y="166" width="10" height="80" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="845" y="208" width="10" height="38" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><rect x="858" y="232" width="10" height="14" rx="1" fill="#88a4be" stroke="none" stroke-width="0"/><text x="850" y="282" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">(B,T,|V|)</text><text x="850" y="298" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">logits</text><rect x="30" y="330" width="840" height="50" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="48" y="352" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Logits are unnormalized scores. Softmax over the last axis turns each position’s |V| scores into a</text><text x="48" y="370" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">next-token distribution — used by the loss in training and by the sampler in generation.</text></svg>
