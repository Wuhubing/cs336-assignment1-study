<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Same model, different data</title><desc id="d">One architecture and training budget branch into TinyStories and OpenWebText runs; OpenWebText ends at higher loss and produces more varied text.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="420" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Same architecture, same budget — different data</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Schematic. Compare shapes and samples, and remember the tokenizers differ.</text><rect x="30" y="190" width="180" height="64" rx="7" fill="#f2f1ef" stroke="none" stroke-width="1.5"/><text x="120" y="222" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">same model</text><text x="120" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">same steps · B · T</text><path d="M210 210 L250 210 L250 150 L280 150" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M210 234 L250 234 L250 310 L280 310" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="284" y="84" width="586" height="144" rx="12" fill="#ecf0ee" stroke="none" stroke-width="0"/><text x="300" y="108" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#426550">TinyStories · 10K tokenizer</text><path d="M300.0 159.9 L305.0 164.1 L310.0 167.9 L315.0 171.4 L320.0 174.5 L325.0 177.3 L330.0 179.8 L335.0 182.2 L340.0 184.2 L345.0 186.1 L350.0 187.8 L355.0 189.4 L360.0 190.8 L365.0 192.1 L370.0 193.2 L375.0 194.2 L380.0 195.2 L385.0 196.0 L390.0 196.8 L395.0 197.5 L400.0 198.1 L405.0 198.7 L410.0 199.2 L415.0 199.7 L420.0 200.1 L425.0 200.5 L430.0 200.8 L435.0 201.1 L440.0 201.4 L445.0 201.7 L450.0 201.9 L455.0 202.1 L460.0 202.3 L465.0 202.5 L470.0 202.6 L475.0 202.8 L480.0 202.9 L485.0 203.0 L490.0 203.1 L495.0 203.2 L500.0 203.3" fill="none" stroke="#426550" stroke-width="2.5"/><path d="M300 208L500 208" fill="none" stroke="#746d67" stroke-width="1"/><text x="510" y="140" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sample (illustrative):</text><text x="510" y="162" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">“Once upon a time, there was</text><text x="510" y="180" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">a little girl named Lily. She loved to play…”</text><rect x="284" y="244" width="586" height="144" rx="12" fill="#eaeff3" stroke="none" stroke-width="0"/><text x="300" y="268" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">OpenWebText · 32K tokenizer</text><path d="M300.0 290.0 L305.0 294.2 L310.0 298.0 L315.0 301.5 L320.0 304.6 L325.0 307.4 L330.0 309.9 L335.0 312.3 L340.0 314.3 L345.0 316.2 L350.0 317.9 L355.0 319.5 L360.0 320.9 L365.0 322.2 L370.0 323.3 L375.0 324.3 L380.0 325.3 L385.0 326.1 L390.0 326.9 L395.0 327.6 L400.0 328.2 L405.0 328.8 L410.0 329.3 L415.0 329.8 L420.0 330.2 L425.0 330.6 L430.0 330.9 L435.0 331.2 L440.0 331.5 L445.0 331.8 L450.0 332.0 L455.0 332.2 L460.0 332.4 L465.0 332.6 L470.0 332.7 L475.0 332.9 L480.0 333.0 L485.0 333.1 L490.0 333.2 L495.0 333.3 L500.0 333.4" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><path d="M300 368L500 368" fill="none" stroke="#746d67" stroke-width="1"/><text x="510" y="300" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">sample (illustrative):</text><text x="510" y="322" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">“The council said on Tuesday that</text><text x="510" y="340" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">the new plan would cost more than…”</text><text x="30" y="282" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">Losses are per token of</text><text x="30" y="297" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">different tokenizers — do not</text><text x="30" y="312" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">compare the numbers naively.</text></svg>
