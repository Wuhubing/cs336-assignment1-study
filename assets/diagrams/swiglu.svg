<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">SwiGLU feed-forward block</title><desc id="d">x of width d_model goes through W1 then SiLU, and in parallel through W3; the two d_ff vectors multiply elementwise, and W2 projects back to d_model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">SwiGLU: one branch gates the other</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">FFN(x) = W₂( SiLU(W₁x) ⊙ W₃x ). Applied to every position independently.</text><rect x="40" y="170" width="90" height="44" rx="8" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="85" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f5d8a">x</text><text x="85" y="206" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#2f5d8a">d_model</text><path d="M130 192 L170 192 L170 122 L200 122" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M170 192 L170 262 L200 262" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="204" y="100" width="110" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="259" y="122" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">W₁</text><text x="259" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">d_model → d_ff</text><rect x="204" y="240" width="110" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="259" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">W₃</text><text x="259" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">d_model → d_ff</text><path d="M316 122L356 122" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="100" width="110" height="44" rx="7" fill="#f6ead3" stroke="#b7791f" stroke-width="1.5"/><text x="415" y="122" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#b7791f">SiLU</text><text x="415" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">the gate</text><path d="M470 122 L540 122 L540 176" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M316 262 L540 262 L540 208" fill="none" stroke="#8c1515" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="540" cy="192" r="16" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="540" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#8c1515">⊙</text><text x="560" y="172" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">elementwise ×</text><text x="560" y="230" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">(…, d_ff)</text><path d="M558 192L640 192" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="644" y="170" width="110" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="699" y="192" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">W₂</text><text x="699" y="208" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">d_ff → d_model</text><path d="M756 192L796 192" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="170" width="70" height="44" rx="8" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="835" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#426550">out</text><text x="835" y="206" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#426550">d_model</text><rect x="40" y="310" width="830" height="50" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="58" y="332" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Three weight matrices (W₁, W₃: d_ff × d_model; W₂: d_model × d_ff). The inner width d_ff sets capacity and cost;</text><text x="58" y="350" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">the output returns to d_model so the residual stream width never changes.</text></svg>
