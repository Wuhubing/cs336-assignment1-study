<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Step size changes the path</title><desc id="d">The gradient is local; a large step can overshoot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Step size changes the path</text><path d="M75 250C245 45 375 45 450 230S690 80 825 110" stroke="#746d67" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="85" r="9" fill="#50705f"/><circle cx="460" cy="230" r="9" fill="#8c1515"/><path d="M250 85L360 145" fill="none" stroke="#50705f" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 85L530 210" fill="none" stroke="#8c1515" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#50705f">smaller step</text><text x="585" y="243" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#8c1515">overshoot risk</text></svg>