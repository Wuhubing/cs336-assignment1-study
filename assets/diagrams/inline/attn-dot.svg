<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t d"><title id="t">Dot product as similarity</title><desc id="d">A query compared with three keys: aligned gives a large positive score, perpendicular gives zero, opposite gives a negative score.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="210" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="208" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><circle cx="120" cy="128" r="3" fill="#282827" stroke="#282827" stroke-width="0"/><path d="M120 128L182 128" fill="none" stroke="#8c1515" stroke-width="3" marker-end="url(#arrow)"/><path d="M120 128L178.261 106.795" fill="none" stroke="#2f5d8a" stroke-width="3"/><circle cx="178.261" cy="106.795" r="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="190" y="132" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">q</text><text x="186.261" y="100.795" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">k</text><text x="120" y="32" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">aligned</text><text x="120" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">q·k  + large</text><circle cx="360" cy="128" r="3" fill="#282827" stroke="#282827" stroke-width="0"/><path d="M360 128L422 128" fill="none" stroke="#8c1515" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 128L360 66" fill="none" stroke="#2f5d8a" stroke-width="3"/><circle cx="360" cy="66" r="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="430" y="132" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">q</text><text x="368" y="60" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">k</text><text x="360" y="32" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">perpendicular</text><text x="360" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">q·k  ≈ 0</text><circle cx="600" cy="128" r="3" fill="#282827" stroke="#282827" stroke-width="0"/><path d="M600 128L662 128" fill="none" stroke="#8c1515" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 128L538 128" fill="none" stroke="#2f5d8a" stroke-width="3"/><circle cx="538" cy="128" r="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="670" y="132" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">q</text><text x="530" y="122" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">k</text><text x="600" y="32" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">opposite</text><text x="600" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">q·k  negative</text></svg>
