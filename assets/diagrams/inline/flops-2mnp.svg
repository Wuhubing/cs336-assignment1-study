<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Why a matmul costs 2mnp FLOPs</title><desc id="d">Each of the m by p output entries needs n multiplies and about n additions, so the total is about 2 m n p.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="40" y="50" width="90" height="60" rx="4" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="85" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">m × n</text><text x="146" y="86" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#282827">·</text><rect x="160" y="36" width="60" height="90" rx="4" fill="#e2eaf3" stroke="#2f5d8a" stroke-width="1.5"/><text x="190" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">n × p</text><text x="236" y="86" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#282827">=</text><rect x="254" y="50" width="60" height="60" rx="4" fill="#e3ece6" stroke="#426550" stroke-width="1.5"/><text x="284" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#426550">m × p</text><rect x="268" y="62" width="12" height="12" rx="2" fill="#426550" stroke="none" stroke-width="0"/><text x="350" y="62" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">one output entry = a length-n dot product</text><text x="350" y="82" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">= n multiplies + (n−1) adds ≈ 2n FLOPs</text><text x="350" y="108" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#8c1515">m·p entries × 2n  →  2mnp</text><text x="40" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Forward pass ≈ 2 × params × tokens for the matmuls; attention scores add a term that grows with T².</text></svg>
