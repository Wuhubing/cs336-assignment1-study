<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="t d"><title id="t">The same word can split differently</title><desc id="d">the at the start of text and the after a space map to different tokens because the space is part of the token.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="170" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="168" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">CONTEXT CHANGES THE PIECES</text><rect x="24" y="48" width="70" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="59" y="67.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">The</text><rect x="98" y="48" width="60" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="128" y="67.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">␠cat</text><text x="170" y="69" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">start of text: “The” has no leading space</text><rect x="24" y="96" width="60" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="54" y="115.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">I</text><rect x="88" y="96" width="82" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="129" y="115.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">␠saw</text><rect x="174" y="96" width="70" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="209" y="115.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">␠the</text><text x="256" y="117" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">mid-sentence: “␠the” is a different token ID</text><text x="24" y="158" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Tokenization is a learned encoding, not a parser: do not expect one token per dictionary word.</text></svg>
