<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d"><title id="t">Memory-mapped token arrays</title><desc id="d">The token file stays on disk; np.memmap exposes it as an array; only the sampled windows are read into RAM and moved to the device.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="200" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="198" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="24" y="50" width="150" height="70" rx="10" fill="#eae9e8" stroke="#746d67" stroke-width="1.5"/><text x="99" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#746d67">disk</text><text x="99" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">tokens.npy · GBs</text><rect x="199" y="50" width="150" height="70" rx="10" fill="#e0e7ed" stroke="#2f5d8a" stroke-width="1.5"/><text x="274" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2f5d8a">np.memmap</text><text x="274" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">array view, lazy</text><path d="M177 85L196 85" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="374" y="50" width="150" height="70" rx="10" fill="#f4ebdd" stroke="#b7791f" stroke-width="1.5"/><text x="449" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#b7791f">RAM</text><text x="449" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">only B×(T+1) ids</text><path d="M352 85L371 85" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="549" y="50" width="150" height="70" rx="10" fill="#e3e8e5" stroke="#426550" stroke-width="1.5"/><text x="624" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#426550">GPU / MPS</text><text x="624" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">x, y tensors</text><path d="M527 85L546 85" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="160" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">dtype must match how you saved the IDs (e.g. uint16), and the maximum ID must be &lt; vocab size.</text><text x="24" y="180" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Moving only the sampled batch avoids loading the corpus onto the device.</text></svg>
