<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Stable cross-entropy with log-sum-exp</title><desc id="d">Naive softmax overflows for large logits; subtracting the maximum logit keeps exponents at most zero and gives the same loss.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="250" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="248" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">NAIVE</text><text x="372" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">STABLE</text><rect x="20" y="46" width="330" height="184" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><rect x="368" y="46" width="332" height="184" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="38" y="78" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">logits o = [1000, 998, 990]</text><text x="38" y="108" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">exp(1000) = inf</text><text x="38" y="134" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">p = inf / inf = NaN</text><text x="38" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">−log p → NaN loss,</text><text x="38" y="190" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">training silently breaks.</text><text x="386" y="78" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">o − max(o) = [0, −2, −10]</text><text x="386" y="108" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">exp(·) = [1, 0.135, 0.00005]</text><text x="386" y="140" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">−log p[y] =</text><text x="400" y="164" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">log Σₐ e^(oₐ−max) − (o_y − max)</text><text x="386" y="196" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Same value, no overflow; never takes</text><text x="386" y="214" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">log of a tiny rounded-off probability.</text></svg>
