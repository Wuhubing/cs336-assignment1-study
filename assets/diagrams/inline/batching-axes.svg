t-size="12" font-weight="700" fill="#426550">y</text><text x="478" y="148" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#426550">(B, T, d_out)</text><text x="40" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Keep B and T in every function signature; attention will later add a head axis too.</text></svg>
