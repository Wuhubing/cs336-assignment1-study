ht="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="160" y="140" width="18" height="18" rx="2" fill="#ba7373" stroke="none" stroke-width="0"/><rect x="180" y="140" width="18" height="18" rx="2" fill="#ba7373" stroke="none" stroke-width="0"/><rect x="40" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="60" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="80" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="100" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="120" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="140" y="160" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="160" y="160" width="18" height="18" rx="2" fill="#ba7373" stroke="none" stroke-width="0"/><rect x="180" y="160" width="18" height="18" rx="2" fill="#ba7373" stroke="none" stroke-width="0"/><text x="120" y="200" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#282827">R⁽ⁱ⁾ (d × d), d = 8</text><text x="260" y="60" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#8c1515">[ cos θ  −sin θ ]</text><text x="260" y="84" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#8c1515">[ sin θ   cos θ ]</text><text x="260" y="120" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Each coloured 2×2 block rotates one pair</text><text x="260" y="138" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">(x₂ₖ₋₁, x₂ₖ). Grey = zeros.</text><text x="260" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">In code, never build this matrix: rotate</text><text x="260" y="188" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">pairs directly with precomputed cos/sin.</text></svg>
