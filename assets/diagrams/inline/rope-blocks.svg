<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">RoPE is block-diagonal</title><desc id="d">The full rotation matrix is block diagonal: d over 2 independent 2 by 2 rotations, one per feature pair.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="220" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="218" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="40" y="20" width="18" height="18" rx="2" fill="#eedcdc" stroke="none" stroke-width="0"/><rect x="60" y="20" width="18" height="18" rx="2" fill="#eedcdc" stroke="none" stroke-width="0"/><rect x="80" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="100" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="120" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="140" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="160" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="180" y="20" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="40" y="40" width="18" height="18" rx="2" fill="#eedcdc" stroke="none" stroke-width="0"/><rect x="60" y="40" width="18" height="18" rx="2" fill="#eedcdc" stroke="none" stroke-width="0"/><rect x="80" y="40" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="100" y="40" width="18" height="18" rx="2" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="120" y="40" width="18" height="18" rx="2" fill="#f2f