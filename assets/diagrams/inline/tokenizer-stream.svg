<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d"><title id="t">Streaming must not split tokens</title><desc id="d">Encoding chunk by chunk and splitting at a chunk boundary gives different tokens than encoding the whole text.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="200" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="198" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">✗ ENCODE EACH CHUNK SEPARATELY</text><rect x="24" y="44" width="58" height="32" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="53" y="65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">…the</text><rect x="88" y="44" width="48" height="32" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="112" y="65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">␠ca</text><rect x="158" y="44" width="28" height="32" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="172" y="65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">t</text><rect x="192" y="44" width="68" height="32" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="226" y="65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">␠sat…</text><path d="M146 38 L146 84" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="4 3"/><text x="154" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#b7791f">chunk boundary</text><text x="24" y="124" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">✓ CARRY THE UNFINISHED PRE-TOKEN INTO THE NEXT CHUNK</text><rect x="24" y="136" width="58" height="32" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="53" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">…the</text><rect x="88" y="136" width="58" height="32" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="117" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">␠cat</text><rect x="152" y="136" width="68" height="32" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="186" y="157" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">␠sat…</text><text x="24" y="190" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Chunks are an I/O detail; the IDs must equal encoding the whole text at once.</text></svg>
