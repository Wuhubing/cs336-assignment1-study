<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t d"><title id="t">Why bias correction</title><desc id="d">Without correction the first moment starts near zero; dividing by one minus beta to the t restores the right scale early in training.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="210" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="208" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><path d="M60 170L680 170" fill="none" stroke="#746d67" stroke-width="1.2"/><path d="M60 170L60 40" fill="none" stroke="#746d67" stroke-width="1.2"/><text x="680" y="188" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">step t</text><text x="52" y="44" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67"></text><path d="M90.0 50.0 L120.0 50.0 L150.0 50.0 L180.0 50.0 L210.0 50.0 L240.0 50.0 L270.0 50.0 L300.0 50.0 L330.0 50.0 L360.0 50.0 L390.0 50.0 L420.0 50.0 L450.0 50.0 L480.0 50.0 L510.0 50.0 L540.0 50.0 L570.0 50.0 L600.0 50.0 L630.0 50.0 L660.0 50.0" fill="none" stroke="#426550" stroke-width="2.5"/><path d="M90.0 158.0 L120.0 147.2 L150.0 137.5 L180.0 128.7 L210.0 120.9 L240.0 113.8 L270.0 107.4 L300.0 101.7 L330.0 96.5 L360.0 91.8 L390.0 87.7 L420.0 83.9 L450.0 80.5 L480.0 77.5 L510.0 74.7 L540.0 72.2 L570.0 70.0 L600.0 68.0 L630.0 66.2 L660.0 64.6" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="5 4"/><text x="480" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">corrected m̂_t ≈ true mean (1.0)</text><text x="270" y="154" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">raw m_t starts near 0</text><text x="60" y="196" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">Constant gradient g = 1, β₁ = 0.9. The same happens to v with β₂, even more slowly.</text></svg>
