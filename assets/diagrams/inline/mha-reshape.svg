<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Reshape for heads</title><desc id="d">A projected tensor of shape B by T by h times d_k is viewed as B by T by h by d_k and transposed to B by h by T by d_k so each head attends over T.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="30" y="50" width="200" height="64" rx="8" fill="#e0e7ed" stroke="#2f5d8a" stroke-width="1.5"/><text x="130" y="76" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">project</text><text x="130" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">(B, T, h·d_k)</text><rect x="260" y="50" width="200" height="64" rx="8" fill="#f4ebdd" stroke="#b7791f" stroke-width="1.5"/><text x="360" y="76" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">view</text><text x="360" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">(B, T, h, d_k)</text><path d="M232 82L256 82" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="50" width="200" height="64" rx="8" fill="#eedcdc" stroke="#8c1515" stroke-width="1.5"/><text x="590" y="76" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">transpose</text><text x="590" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#282827">(B, h, T, d_k)</text><path d="M462 82L486 82" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="150" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Head becomes a batch-like axis, so one batched matmul runs all heads at once.</text><text x="30" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Reverse the steps (transpose, then reshape) before W_O.</text></svg>
