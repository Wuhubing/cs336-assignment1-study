<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="t d"><title id="t">Printing hides control characters</title><desc id="d">chr(0) prints as nothing visible, but its repr shows the escape; debugging token boundaries needs repr.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="170" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="168" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#746d67" letter-spacing="1.2">WHAT PRINT() SHOWS</text><text x="372" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">WHAT REPR() SHOWS</text><rect x="20" y="46" width="330" height="90" rx="10" fill="#f2f1ef" stroke="none" stroke-width="0"/><rect x="370" y="46" width="330" height="90" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="38" y="84" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">&gt;&gt;&gt; print(&quot;a&quot; + chr(0) + &quot;b&quot;)</text><text x="38" y="112" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#282827">ab</text><text x="88" y="112" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">← the NUL is invisible</text><text x="388" y="84" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">&gt;&gt;&gt; repr(&quot;a&quot; + chr(0) + &quot;b&quot;)</text><text x="388" y="112" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#426550">&#x27;a\x00b&#x27;</text><text x="20" y="160" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Use repr() or list(s.encode(&quot;utf-8&quot;)) when a token boundary “looks” wrong.</text></svg>
