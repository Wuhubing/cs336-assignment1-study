<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Every position predicts the next token</title><desc id="d">During training all positions produce predictions at once, each seeing only its prefix; in generation only the last prediction is used.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="40" y="110" width="110" height="32" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="95" y="130.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">Once</text><rect x="40" y="36" width="110" height="32" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="95" y="56.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">→ upon</text><path d="M95 106L95 72" fill="none" stroke="#746d67" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="190" y="110" width="110" height="32" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="245" y="130.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">upon</text><rect x="190" y="36" width="110" height="32" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="245" y="56.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">→ a</text><path d="M245 106L245 72" fill="none" stroke="#746d67" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M120 110 Q175.0 88 230 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><rect x="340" y="110" width="110" height="32" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="395" y="130.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">a</text><rect x="340" y="36" width="110" height="32" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="395" y="56.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">→ time</text><path d="M395 106L395 72" fill="none" stroke="#746d67" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M120 110 Q250.0 88 380 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><path d="M270 110 Q325.0 88 380 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><rect x="490" y="110" width="110" height="32" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="545" y="130.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">time</text><rect x="490" y="36" width="110" height="32" rx="5" fill="#8c1515" stroke="none" stroke-width="0"/><text x="545" y="56.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ffffff">→ there</text><path d="M545 106L545 72" fill="none" stroke="#8c1515" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M120 110 Q325.0 88 530 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><path d="M270 110 Q400.0 88 530 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><path d="M420 110 Q475.0 88 530 74" fill="none" stroke="#ded9d2" stroke-width="1.2"/><text x="40" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Training: 4 predictions per sequence, all at once.  Generation: only the last one (red) is sampled.</text></svg>
