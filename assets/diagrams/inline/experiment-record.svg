<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t d"><title id="t">A run record</title><desc id="d">A template card listing what to record for every run: hypothesis, versions, data, seed, optimizer settings, budget, time, results and artifacts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="230" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="228" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="20" y="16" width="680" height="200" rx="12" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><text x="40" y="40" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">RUN RECORD · ONE PER EXPERIMENT</text><text x="40" y="74" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">hypothesis</text><text x="158" y="74" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">what you expect and why</text><text x="370" y="74" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">code + tokenizer</text><text x="488" y="74" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">git commit, merges/vocab file</text><text x="40" y="104" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">data</text><text x="158" y="104" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">train/val arrays, dtype</text><text x="370" y="104" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">seed</text><text x="488" y="104" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">every RNG</text><text x="40" y="134" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">optimizer</text><text x="158" y="134" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">α_max, α_min, T_w, T_c, β, λ, clip M</text><text x="370" y="134" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">budget</text><text x="488" y="134" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">B × T × steps = tokens</text><text x="40" y="164" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">time</text><text x="158" y="164" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">wall-clock, hardware</text><text x="370" y="164" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">results</text><text x="488" y="164" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">val loss curve + final, samples</text><text x="40" y="194" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">artifacts</text><text x="158" y="194" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">raw log file, checkpoint path</text></svg>
