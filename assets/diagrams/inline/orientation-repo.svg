<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d"><title id="t">Where your code lives</title><desc id="d">Your modules in cs336_basics are called through thin adapter functions by the staff tests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="200" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="198" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><rect x="24" y="50" width="180" height="84" rx="10" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="114" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#8c1515">cs336_basics/</text><text x="114" y="110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">your implementation</text><rect x="270" y="50" width="180" height="84" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="360" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b7791f">tests/adapters.py</text><text x="360" y="110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">thin glue: call your code</text><rect x="516" y="50" width="180" height="84" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="606" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#426550">tests/</text><text x="606" y="110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">staff tests = the spec</text><path d="M268 92L208 92" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="238" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">calls</text><path d="M514 92L454 92" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="484" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">calls</text><text x="24" y="182" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Edit the left and the middle. Never edit the tests: their pass/fail is your observable-behaviour specification.</text></svg>
