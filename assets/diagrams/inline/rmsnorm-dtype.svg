<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Upcast before squaring</title><desc id="d">In float16, squaring 300 overflows to infinity; upcasting to float32 first keeps the RMS finite, then cast the result back.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">✗ SQUARE IN FLOAT16</text><rect x="20" y="44" width="330" height="96" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="38" y="74" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">a = 300 (fp16)</text><text x="38" y="100" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">a² = 90,000 &gt; 65,504</text><text x="38" y="126" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">→ inf → RMS = inf → output 0/NaN</text><text x="372" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">✓ UPCAST, COMPUTE, CAST BACK</text><rect x="370" y="44" width="330" height="96" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="388" y="74" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">x = a.to(torch.float32)</text><text x="388" y="100" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">normalize in float32</text><text x="388" y="126" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">return result.to(in_dtype)</text><text x="20" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">float16 max ≈ 65,504. Accumulation dtype and output dtype are separate decisions.</text></svg>
