<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d"><title id="t">Global versus per-parameter clipping</title><desc id="d">Clipping each parameter separately changes the gradient direction; clipping the global norm scales every part equally and keeps the direction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="200" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="198" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="30" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">✓ GLOBAL NORM</text><text x="24" y="72" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">before</text><rect x="84" y="54" width="210" height="20" rx="3" fill="#97aec4" stroke="none" stroke-width="0"/><rect x="84" y="78" width="70" height="20" rx="3" fill="#c68a8a" stroke="none" stroke-width="0"/><text x="24" y="128" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">after</text><rect x="84" y="110" width="84" height="20" rx="3" fill="#97aec4" stroke="none" stroke-width="0"/><rect x="84" y="134" width="28" height="20" rx="3" fill="#c68a8a" stroke="none" stroke-width="0"/><text x="84" y="180" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">ratio 3 : 1 kept</text><text x="384" y="30" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">✗ PER PARAMETER</text><text x="384" y="72" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">before</text><rect x="444" y="54" width="210" height="20" rx="3" fill="#97aec4" stroke="none" stroke-width="0"/><rect x="444" y="78" width="70" height="20" rx="3" fill="#c68a8a" stroke="none" stroke-width="0"/><text x="384" y="128" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">after</text><rect x="444" y="110" width="70" height="20" rx="3" fill="#97aec4" stroke="none" stroke-width="0"/><rect x="444" y="134" width="70" height="20" rx="3" fill="#c68a8a" stroke="none" stroke-width="0"/><text x="444" y="180" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">ratio becomes 1 : 1</text><text x="302" y="68" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#2f5d8a">param A</text><text x="162" y="92" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">param B</text></svg>
