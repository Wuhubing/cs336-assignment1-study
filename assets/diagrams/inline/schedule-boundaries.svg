<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Boundary checks</title><desc id="d">A table of the schedule values expected at t = 0, t = T_w, t = T_c and t greater than T_c.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="30" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">TEST THESE FOUR POINTS FIRST</text><rect x="24" y="46" width="158" height="84" rx="10" fill="#f5ece0" stroke="none" stroke-width="0"/><text x="103" y="76" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b7791f">t = 0</text><text x="103" y="108" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#282827">α_t = 0</text><rect x="194" y="46" width="158" height="84" rx="10" fill="#efdede" stroke="none" stroke-width="0"/><text x="273" y="76" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#8c1515">t = T_w</text><text x="273" y="108" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#282827">α_t = α_max</text><rect x="364" y="46" width="158" height="84" rx="10" fill="#e2e8ef" stroke="none" stroke-width="0"/><text x="443" y="76" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#2f5d8a">t = T_c</text><text x="443" y="108" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#282827">α_t = α_min</text><rect x="534" y="46" width="158" height="84" rx="10" fill="#e5e9e6" stroke="none" stroke-width="0"/><text x="613" y="76" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#426550">t &gt; T_c</text><text x="613" y="108" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#282827">α_t = α_min</text><text x="24" y="162" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">No jumps: the curve must be continuous at T_w and at T_c.</text></svg>
