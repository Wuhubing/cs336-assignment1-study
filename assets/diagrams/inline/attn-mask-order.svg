<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Mask before softmax, not after</title><desc id="d">Zeroing a probability after softmax leaves a row summing to 0.7; setting the score to minus infinity before softmax keeps the row summing to 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="250" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="248" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">✗ MASK AFTER SOFTMAX</text><text x="372" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">✓ MASK BEFORE SOFTMAX</text><rect x="30" y="48" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="58" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.2</text><rect x="92" y="48" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="120" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.5</text><rect x="154" y="48" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="182" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.3</text><text x="230" y="70" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">softmax</text><path d="M123 88L123 110" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="116" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="58" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.2</text><rect x="92" y="116" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="120" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.5</text><rect x="154" y="116" width="56" height="34" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="182" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.0</text><text x="230" y="138" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">zero future</text><text x="30" y="190" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b7791f">row sum = 0.7 ≠ 1</text><text x="30" y="214" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">weights no longer a distribution</text><rect x="380" y="48" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="408" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.4</text><rect x="442" y="48" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="470" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">1.3</text><rect x="504" y="48" width="56" height="34" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="532" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">−∞</text><text x="580" y="70" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">scores</text><path d="M473 88L473 110" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="116" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="408" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.29</text><rect x="442" y="116" width="56" height="34" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="470" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0.71</text><rect x="504" y="116" width="56" height="34" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="532" y="138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#282827">0</text><text x="580" y="138" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">softmax</text><text x="380" y="190" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#426550">row sum = 1.00 ✓</text><text x="380" y="214" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">e^(−∞) = 0 — renormalized over visible keys</text></svg>
