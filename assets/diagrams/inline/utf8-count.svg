<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">Characters versus bytes</title><desc id="d">The string hello 中文 has 8 characters but 12 UTF-8 bytes; a lone C3 byte is invalid and decodes to the replacement character.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="220" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="218" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">LENGTH DEPENDS ON WHAT YOU COUNT</text><rect x="24" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="41" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">h</text><rect x="24" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="64" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="81" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">e</text><rect x="64" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="104" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="121" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">l</text><rect x="104" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="144" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="161" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">l</text><rect x="144" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="184" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="201" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">o</text><rect x="184" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="224" y="46" width="34" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="241" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">␠</text><rect x="224" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="264" y="46" width="110" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="319" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">中</text><rect x="264" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="302" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="340" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="380" y="46" width="110" height="34" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="435" y="69" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#2f5d8a">文</text><rect x="380" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="418" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><rect x="456" y="88" width="34" height="26" rx="4" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="504" y="69" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">8 characters</text><text x="504" y="106" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">12 bytes</text><text x="24" y="150" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">NOT EVERY BYTE SEQUENCE DECODES</text><rect x="24" y="162" width="50" height="30" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="49" y="181.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">C3</text><text x="90" y="182" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">alone →  bytes([0xC3]).decode(&quot;utf-8&quot;, errors=&quot;replace&quot;)  →  “�” (U+FFFD)</text></svg>
