<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Attention mixes positions, the FFN does not</title><desc id="d">Attention connects every token with earlier tokens; the feed-forward block applies the same function to each token separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="30" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f5d8a" letter-spacing="1.2">ATTENTION: ACROSS POSITIONS</text><text x="384" y="30" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b7791f" letter-spacing="1.2">FFN: ONE POSITION AT A TIME</text><rect x="40" y="130" width="56" height="28" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="68" y="148.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">t1</text><rect x="40" y="48" width="56" height="28" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="68" y="66.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">t1</text><path d="M68 128L68 78" fill="none" stroke="#829eb9" stroke-width="1.3"/><rect x="400" y="130" width="56" height="28" rx="5" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="428" y="148.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b7791f">t1</tex