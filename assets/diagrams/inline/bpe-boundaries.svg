<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t d"><title id="t">Pre-token and special-token boundaries</title><desc id="d">Pair counts never cross a pre-token boundary, and special tokens split the text before counting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="720" height="190" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="718" height="188" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="24" y="32" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">COUNTS STAY INSIDE PRE-TOKENS</text><rect x="24" y="46" width="46" height="38" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="47" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">the</text><rect x="96" y="46" width="56" height="38" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="124" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">␠cat</text><rect x="178" y="46" width="146" height="38" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="251" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">&lt;|endoftext|&gt;</text><rect x="350" y="46" width="26" height="38" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="363" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">A</text><rect x="402" y="46" width="56" height="38" rx="6" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="430" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">␠dog</text><text x="83" y="108" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">✗ (e, ␠)</text><path d="M73 88 Q83 100 93 88" fill="none" stroke="#8c1515" stroke-width="1.5"/><text x="24" y="146" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">The pair spanning “the | ␠cat” is never counted. The special token is removed before counting,</text><text x="24" y="166" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">so nothing merges across a document boundary; it is added to the vocabulary as one indivisible token.</text></svg>
