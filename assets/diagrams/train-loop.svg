<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">The training loop</title><desc id="d">A loop of get batch, forward, loss, backward, clip, set learning rate, optimizer step and zero grad, with periodic validation, logging and checkpointing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">One iteration, then repeat N_steps times</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">The inner cycle updates weights; the outer ring measures and saves without changing them.</text><path d="M253.5 126.5 L286.5 126.5" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M379.6 145.5 L428.2 175.2" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M459.4 213.2 L459.4 270.8" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M428.2 308.8 L379.6 338.5" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M286.5 357.5 L253.5 357.5" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M160.4 338.5 L111.8 308.8" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M80.6 270.8 L80.6 213.2" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M111.8 175.2 L160.4 145.5" fill="none" stroke="#8c1515" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="133.55" y="111.515" width="116" height="30" rx="8" fill="#dae2ea" stroke="#2f5d8a" stroke-width="1.5"/><text x="191.55" y="131.515" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#2f5d8a">get_batch</text><rect x="290.45" y="111.515" width="116" height="30" rx="8" fill="#dae2ea" stroke="#2f5d8a" stroke-width="1.5"/><text x="348.45" y="131.515" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#2f5d8a">model(x) → logits</text><rect x="401.395" y="179.165" width="116" height="30" rx="8" fill="#f2e7d7" stroke="#b7791f" stroke-width="1.5"/><text x="459.395" y="199.165" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b7791f">cross_entropy</text><rect x="401.395" y="274.835" width="116" height="30" rx="8" fill="#f2e7d7" stroke="#b7791f" stroke-width="1.5"/><text x="459.395" y="294.835" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#b7791f">loss.backward()</text><rect x="290.45" y="342.485" width="116" height="30" rx="8" fill="#ead5d5" stroke="#8c1515" stroke-width="1.5"/><text x="348.45" y="362.485" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#8c1515">clip grads</text><rect x="133.55" y="342.485" width="116" height="30" rx="8" fill="#ead5d5" stroke="#8c1515" stroke-width="1.5"/><text x="191.55" y="362.485" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#8c1515">set lr(t)</text><rect x="22.6047" y="274.835" width="116" height="30" rx="8" fill="#dde3e0" stroke="#426550" stroke-width="1.5"/><text x="80.6047" y="294.835" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#426550">opt.step()</text><rect x="22.6047" y="179.165" width="116" height="30" rx="8" fill="#dde3e0" stroke="#426550" stroke-width="1.5"/><text x="80.6047" y="199.165" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#426550">zero_grad()</text><circle cx="270" cy="242" r="36" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="270" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">t += 1</text><text x="270" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">↻</text><text x="548" y="100" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">EVERY K STEPS (NO WEIGHT CHANGE)</text><rect x="548" y="118" width="322" height="50" rx="8" fill="#e5e9e6" stroke="none" stroke-width="0"/><text x="562" y="139" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#426550">validate</text><text x="562" y="157" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">model.eval(), no_grad, val loss</text><rect x="548" y="180" width="322" height="50" rx="8" fill="#e2e8ef" stroke="none" stroke-width="0"/><text x="562" y="201" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">log</text><text x="562" y="219" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">step, wall-clock, train + val loss, lr</text><rect x="548" y="242" width="322" height="50" rx="8" fill="#f5ece0" stroke="none" stroke-width="0"/><text x="562" y="263" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#b7791f">checkpoint</text><text x="562" y="281" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">model + optimizer + t</text><rect x="548" y="312" width="322" height="64" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="562" y="336" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">Sanity check first: overfit one batch.</text><text x="562" y="356" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">Loss should drop near zero within a few hundred steps.</text></svg>
