<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Three measurements</title><desc id="d">Compression, throughput, and storage describe different costs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Three measurements</text><rect x="75" y="108" width="230" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="190.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Bytes / token</text><rect x="340" y="108" width="230" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="455.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Bytes / second</text><path d="M310 146L333 146" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="605" y="108" width="230" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="720.0" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">ID storage</text><path d="M575 146L598 146" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#746d67">Measure on named corpus + tokenizer + machine</text></svg>