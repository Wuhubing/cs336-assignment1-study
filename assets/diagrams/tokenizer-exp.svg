<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Measuring a tokenizer</title><desc id="d">A 2 by 2 grid of tokenizer and corpus for bytes per token, a throughput formula, and why uint16 fits token IDs below 65,536.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="380" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Measure the tokenizer like a system</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Fill the grid with your own measurements; the cells are placeholders.</text><text x="30" y="92" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">BYTES PER TOKEN</text><text x="170" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">on TinyStories</text><text x="290" y="116" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">on OpenWebText</text><text x="30" y="156" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">TS 10K tok</text><rect x="118" y="126" width="108" height="46" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="172" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">in-domain</text><text x="172" y="164" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#746d67">? bytes/tok</text><rect x="238" y="126" width="108" height="46" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="292" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">shifted</text><text x="292" y="164" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#746d67">? bytes/tok</text><text x="30" y="212" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">OWT 32K tok</text><rect x="118" y="182" width="108" height="46" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="172" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">shifted</text><text x="172" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#746d67">? bytes/tok</text><rect x="238" y="182" width="108" height="46" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="292" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">in-domain</text><text x="292" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#746d67">? bytes/tok</text><text x="30" y="262" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">Off-diagonal cells show how a tokenizer</text><text x="30" y="277" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">compresses text it was not trained on.</text><text x="400" y="92" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">THROUGHPUT</text><rect x="400" y="104" width="200" height="70" rx="8" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="500" y="134" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">bytes processed</text><path d="M430 142L570 142" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="162" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5d8a">elapsed seconds</text><text x="400" y="196" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">Record machine, file size and</text><text x="400" y="211" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">implementation with the number.</text><text x="640" y="92" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">TOKEN ARRAY DTYPE</text><rect x="640" y="104" width="230" height="44" rx="6" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="654" y="123" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">uint8</text><text x="730" y="123" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">max 255</text><text x="654" y="140" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">IDs wrap → corrupt</text><rect x="640" y="156" width="230" height="44" rx="6" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="654" y="175" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">uint16</text><text x="730" y="175" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">max 65,535</text><text x="654" y="192" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">≥ 32K vocab, 2 B/token</text><rect x="640" y="208" width="230" height="44" rx="6" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="654" y="227" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b7791f">int64</text><text x="730" y="227" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#282827">max 9.2e18</text><text x="654" y="244" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">fits, but 4× the bytes</text><rect x="30" y="300" width="840" height="60" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="324" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">Keep provenance: which tokenizer (and which merges file) produced each .npy array.</text><text x="48" y="344" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Mixing arrays from different tokenizers silently breaks every later loss number.</text></svg>
