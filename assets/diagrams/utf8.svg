<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Variable-length UTF-8</title><desc id="d">Characters can require different numbers of bytes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Variable-length UTF-8</text><rect x="60" y="95" width="200" height="70" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="160.0" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">A</text><text x="160.0" y="151" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">ASCII character</text><rect x="340" y="95" width="420" height="70" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="550.0" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">41</text><text x="550.0" y="151" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">one UTF-8 byte</text><path d="M262 130L330 130" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="205" width="200" height="70" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="160.0" y="235" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">牛</text><text x="160.0" y="261" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">CJK character</text><rect x="340" y="205" width="420" height="70" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="550.0" y="235" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">E7 89 9B</text><text x="550.0" y="261" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">three UTF-8 bytes</text><path d="M262 240L330 240" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/></svg>