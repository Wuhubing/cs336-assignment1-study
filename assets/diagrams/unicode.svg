<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Character, code point, bytes</title><desc id="d">Three characters shown as glyph, Unicode code point, UTF-8 bytes and UTF-16 bytes; a composed and a decomposed é look identical but differ in code points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Four layers that are easy to confuse</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">The same abstract text can be stored as different bytes. Only the byte layer is what a byte-level tokenizer sees.</text><text x="30" y="114" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">glyph</text><text x="30" y="132" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">what you see</text><text x="30" y="176" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">code point</text><text x="30" y="194" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">ord(c)</text><text x="30" y="238" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">UTF-8</text><text x="30" y="256" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">bytes, 1–4 each</text><text x="30" y="300" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">UTF-16-LE</text><text x="30" y="318" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">bytes, 2 or 4 each</text><rect x="180" y="90" width="150" height="50" rx="8" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><text x="255" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#282827">A</text><rect x="180" y="158" width="150" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="255" y="177.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">U+0041</text><rect x="180" y="220" width="150" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="255" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">41</text><rect x="180" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="216" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">41</text><rect x="258" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="294" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">00</text><rect x="352" y="90" width="150" height="50" rx="8" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><text x="427" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#282827">é</text><rect x="352" y="158" width="150" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="427" y="177.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">U+00E9</text><rect x="352" y="220" width="72" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="388" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">C3</text><rect x="430" y="220" width="72" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="466" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">A9</text><rect x="352" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="388" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">E9</text><rect x="430" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="466" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">00</text><rect x="524" y="90" width="150" height="50" rx="8" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><text x="599" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#282827">中</text><rect x="524" y="158" width="150" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="599" y="177.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">U+4E2D</text><rect x="524" y="220" width="46" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="547" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">E4</text><rect x="576" y="220" width="46" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="599" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">B8</text><rect x="628" y="220" width="46" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="651" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">AD</text><rect x="524" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="560" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">2D</text><rect x="602" y="282" width="72" height="30" rx="5" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="638" y="301.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#746d67">4E</text><rect x="696" y="90" width="150" height="50" rx="8" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><text x="771" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#282827">🙂</text><rect x="696" y="158" width="150" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="771" y="177.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">U+1F642</text><rect x="696" y="220" width="33" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="712.5" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">F0</text><rect x="735" y="220" width="33" height="30" rx="5" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="751.5" y="239.68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">9F</text><rect x="774" y="220" width="33" height="30" rx="5" fill="#f