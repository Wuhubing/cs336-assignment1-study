<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">RoPE rotates feature pairs</title><desc id="d">A query at position m is rotated by m theta and a key at position n by n theta; their dot product depends on the angle difference (m minus n) theta. Different pairs rotate at different frequencies.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">RoPE: rotate each feature pair by (position × frequency)</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">The q·k score then depends only on the relative offset m − n. Rotations are fixed, not learned.</text><circle cx="190" cy="225" r="110" fill="#faf7f2" stroke="#ded9d2" stroke-width="1.5"/><path d="M70 225L310 225" fill="none" stroke="#ded9d2" stroke-width="1"/><path d="M190 345L190 105" fill="none" stroke="#ded9d2" stroke-width="1"/><path d="M190 225 L285.6 199.4" fill="none" stroke="#8c1515" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="285.627" cy="199.377" r="4" fill="#8c1515" stroke="#8c1515" stroke-width="0"/><text x="295.627" y="193.377" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">q</text><path d="M190 225 L120.0 155.0" fill="none" stroke="#8c1515" stroke-width="2.5"/><circle cx="119.996" cy="154.996" r="4" fill="#8c1515" stroke="#8c1515" stroke-width="0"/><text x="109.996" y="148.996" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">R(m=5)·q</text><path d="M190 225 L287.5 242.2" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="287.496" cy="242.191" r="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="297.496" y="236.191" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">k</text><path d="M190 225 L268.0 164.0" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><circle cx="268.013" cy="164.05" r="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="278.013" y="158.05" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">R(n=2)·k</text><path d="M221.5 200.4 A40 40 0 0 0 161.7 196.7" fill="none" stroke="#b7791f" stroke-width="2.5"/><text x="194" y="175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">(m−n)θ</text><text x="190" y="367" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">one feature pair (a 2-D plane)</text><text x="420" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">DIFFERENT PAIRS, DIFFERENT SPEEDS</text><circle cx="450" cy="170" r="36" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><path d="M450 170 L450.0 140.0" fill="none" stroke="#e8d0d0" stroke-width="2"/><path d="M450 170 L475.2 153.8" fill="none" stroke="#d7adad" stroke-width="2"/><path d="M450 170 L477.3 182.5" fill="none" stroke="#c68a8a" stroke-width="2"/><path d="M450 170 L454.2 199.7" fill="none" stroke="#b46767" stroke-width="2"/><path d="M450 170 L427.3 189.6" fill="none" stroke="#a34444" stroke-width="2"/><path d="M450 170 L421.2 161.5" fill="none" stroke="#922121" stroke-width="2"/><text x="450" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">pair 1</text><text x="450" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">fast</text><circle cx="560" cy="170" r="36" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><path d="M560 170 L560.0 140.0" fill="none" stroke="#e8d0d0" stroke-width="2"/><path d="M560 170 L570.3 141.8" fill="none" stroke="#d7adad" stroke-width="2"/><path d="M560 170 L579.3 147.1" fill="none" stroke="#c68a8a" stroke-width="2"/><path d="M560 170 L586.0 155.1" fill="none" stroke="#b46767" stroke-width="2"/><path d="M560 170 L589.6 164.9" fill="none" stroke="#a34444" stroke-width="2"/><path d="M560 170 L589.5 175.3" fill="none" stroke="#922121" stroke-width="2"/><text x="560" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">pair 2</text><text x="560" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67"></text><circle cx="670" cy="170" r="36" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><path d="M670 170 L670.0 140.0" fill="none" stroke="#e8d0d0" stroke-width="2"/><path d="M670 170 L673.0 140.1" fill="none" stroke="#d7adad" stroke-width="2"/><path d="M670 170 L676.0 140.6" fill="none" stroke="#c68a8a" stroke-width="2"/><path d="M670 170 L678.9 141.3" fill="none" stroke="#b46767" stroke-width="2"/><path d="M670 170 L681.7 142.4" fill="none" stroke="#a34444" stroke-width="2"/><path d="M670 170 L684.4 143.7" fill="none" stroke="#922121" stroke-width="2"/><text x="670" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">pair 3</text><text x="670" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67"></text><circle cx="780" cy="170" r="36" fill="#fffdfa" stroke="#ded9d2" stroke-width="1.5"/><path d="M780 170 L780.0 140.0" fill="none" stroke="#e8d0d0" stroke-width="2"/><path d="M780 170 L780.6 140.0" fill="none" stroke="#d7adad" stroke-width="2"/><path d="M780 170 L781.2 140.0" fill="none" stroke="#c68a8a" stroke-width="2"/><path d="M780 170 L781.8 140.1" fill="none" stroke="#b46767" stroke-width="2"/><path d="M780 170 L782.4 140.1" fill="none" stroke="#a34444" stroke-width="2"/><path d="M780 170 L783.0 140.1" fill="none" stroke="#922121" stroke-width="2"/><text x="780" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#282827">pair d/2</text><text x="780" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">slow</text><text x="420" y="270" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">Arrows show positions 0–5. θ_k = Θ^(−(2k−2)/d): early pairs</text><text x="420" y="286" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#282827">spin quickly (fine offsets), late pairs slowly (long range).</text><rect x="420" y="310" width="450" height="64" rx="10" fill="#f6ead3" stroke="none" stroke-width="0"/><text x="438" y="334" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7791f">Apply to q and k only (not v).</text><text x="438" y="354" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">cos/sin tables depend only on position → precompute once.</text></svg>
