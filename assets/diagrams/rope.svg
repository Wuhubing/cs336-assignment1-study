<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Paired rotations</title><desc id="d">A vector pair rotates by a position-dependent angle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Paired rotations</text><path d="M200 230L200 90M100 170L300 170" stroke="#746d67" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 170L270 110" stroke="#8c1515" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 170L280 205" stroke="#50705f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="170" r="6" fill="#282827"/><text x="275" y="95" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#8c1515">position i</text><text x="300" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#50705f">position j</text><rect x="450" y="100" width="340" height="140" rx="10" fill="#f6f2ec" stroke="#ded9d2" stroke-width="2"/><text x="620.0" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">relative angle</text><text x="620.0" y="156" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#746d67">different positions rotate the same feature plane</text></svg>