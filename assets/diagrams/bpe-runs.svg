<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Two tokenizers to train and compare</title><desc id="d">TinyStories 10K and OpenWebText 32K tokenizers differ in corpus and vocabulary; measure time, memory, longest token and where time goes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="360" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="358" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Two corpora, two vocabularies</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Same algorithm, different data. What to measure for each run (bars are placeholders, not results).</text><rect x="30" y="80" width="410" height="250" rx="12" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="48" y="108" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#426550">TinyStories</text><text x="422" y="108" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#426550">vocab 10,000</text><text x="48" y="128" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">simple children’s stories, small vocabulary of styles</text><text x="48" y="166" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">training time</text><text x="48" y="181" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">wall clock</text><rect x="180" y="154" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="192" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="48" y="208" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">peak memory</text><text x="48" y="223" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">RSS</text><rect x="180" y="196" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="192" y="212" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="48" y="250" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">longest token</text><text x="48" y="265" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">inspect its bytes</text><rect x="180" y="238" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="192" y="254" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="48" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">where time goes</text><text x="48" y="307" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">profile</text><rect x="180" y="280" width="150" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="180" y="280" width="60" height="22" rx="4" fill="#97aa9f" stroke="none" stroke-width="0"/><text x="210" y="296" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#282827">pre-tok</text><text x="285" y="296" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#282827">merge updates</text><text x="340" y="296" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#426550">?</text><rect x="460" y="80" width="410" height="250" rx="12" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="478" y="108" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#2f5d8a">OpenWebText</text><text x="852" y="108" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2f5d8a">vocab 32,000</text><text x="478" y="128" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">diverse web text: news, code, lists, URLs</text><text x="478" y="166" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">training time</text><text x="478" y="181" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">wall clock</text><rect x="610" y="154" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="622" y="170" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="478" y="208" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">peak memory</text><text x="478" y="223" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">RSS</text><rect x="610" y="196" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="622" y="212" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="478" y="250" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">longest token</text><text x="478" y="265" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">inspect its bytes</text><rect x="610" y="238" width="230" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><text x="622" y="254" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">measure →</text><text x="478" y="292" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">where time goes</text><text x="478" y="307" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#746d67">profile</text><rect x="610" y="280" width="150" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="610" y="280" width="60" height="22" rx="4" fill="#8da6bf" stroke="none" stroke-width="0"/><text x="640" y="296" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#282827">pre-tok</text><text x="715" y="296" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#282827">merge updates</text><text x="770" y="296" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#2f5d8a">?</text><text x="30" y="350" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Special token for both: &lt;|endoftext|&gt;. Keep train/validation splits separate for later LM evaluation.</text></svg>
