<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">From logits to loss to perplexity</title><desc id="d">Three positions: softmax turns logits into probabilities, the true next token’s probability gives −log p, the mean is the loss, and exp of the mean is perplexity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="430" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">From logits to loss to perplexity</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Each position predicts the next token. Only the true token’s probability (red bar) enters the loss.</text><rect x="30" y="76" width="180" height="318" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="44" y="98" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">POSITION 1</text><text x="44" y="120" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">“the” → ?</text><rect x="44" y="254.073" width="26" height="7.9275" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="57" y="249.073" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.06</text><text x="57" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">the</text><rect x="77" y="174.614" width="26" height="87.3862" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="90" y="169.614" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">0.62</text><text x="90" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">cat</text><rect x="110" y="246.036" width="26" height="15.964" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="123" y="241.036" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.11</text><text x="123" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">sat</text><rect x="143" y="254.827" width="26" height="7.1731" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="156" y="249.827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.05</text><text x="156" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">on</text><rect x="176" y="240.451" width="26" height="21.5492" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="189" y="235.451" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.15</text><text x="189" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">mat</text><path d="M42 262L205 262" fill="none" stroke="#ded9d2" stroke-width="1"/><text x="44" y="300" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">target = “cat”</text><text x="44" y="322" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">p = 0.62</text><rect x="40" y="334" width="160" height="44" rx="6" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="120" y="361" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">ℓ1 = −log p = 0.47</text><rect x="226" y="76" width="180" height="318" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="240" y="98" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">POSITION 2</text><text x="240" y="120" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">“the cat” → ?</text><rect x="240" y="249.948" width="26" height="12.0521" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="253" y="244.948" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.09</text><text x="253" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">the</text><rect x="273" y="251.095" width="26" height="10.9052" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="286" y="246.095" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.08</text><text x="286" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">cat</text><rect x="306" y="225.793" width="26" height="36.2065" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="319" y="220.793" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">0.26</text><text x="319" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">sat</text><rect x="339" y="235.178" width="26" height="26.8224" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="352" y="230.178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.19</text><text x="352" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">on</text><rect x="372" y="207.986" width="26" height="54.0138" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="385" y="202.986" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.39</text><text x="385" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">mat</text><path d="M238 262L401 262" fill="none" stroke="#ded9d2" stroke-width="1"/><text x="240" y="300" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">target = “sat”</text><text x="240" y="322" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">p = 0.26</text><rect x="236" y="334" width="160" height="44" rx="6" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="316" y="361" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">ℓ2 = −log p = 1.35</text><rect x="422" y="76" width="180" height="318" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="436" y="98" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">POSITION 3</text><text x="436" y="120" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#282827">“the cat sat” → ?</text><rect x="436" y="244.695" width="26" height="17.3049" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="449" y="239.695" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.12</text><text x="449" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">the</text><rect x="469" y="250.4" width="26" height="11.5998" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="482" y="245.4" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.08</text><text x="482" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">cat</text><rect x="502" y="254.224" width="26" height="7.7756" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="515" y="249.224" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.06</text><text x="515" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">sat</text><rect x="535" y="253.407" width="26" height="8.59337" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="548" y="248.407" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">0.06</text><text x="548" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#8c1515">on</text><rect x="568" y="167.274" width="26" height="94.7263" rx="3" fill="#d9d1c9" stroke="none" stroke-width="0"/><text x="581" y="162.274" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">0.68</text><text x="581" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="400" fill="#746d67">mat</text><path d="M434 262L597 262" fill="none" stroke="#ded9d2" stroke-width="1"/><text x="436" y="300" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">target = “on”</text><text x="436" y="322" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#282827">p = 0.06</text><rect x="432" y="334" width="160" height="44" rx="6" fill="#f0e3e0" stroke="none" stroke-width="0"/><text x="512" y="361" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8c1515">ℓ3 = −log p = 2.79</text><path d="M606 356L636 356" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="300" width="230" height="94" rx="10" fill="#fffdfa" stroke="#8c1515" stroke-width="2"/><text x="656" y="322" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">AVERAGE OVER POSITIONS</text><text x="656" y="348" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#282827">ℓ = (0.47+1.35+2.79)/3</text><text x="656" y="376" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#8c1515">= 1.54 nats</text><path d="M755 296L755 226" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="266" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8c1515">exp( · )</text><rect x="640" y="120" width="230" height="100" rx="10" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="656" y="144" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#426550" letter-spacing="1.2">PERPLEXITY</text><text x="656" y="180" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#426550">PPL = e^1.54 = 4.66</text><text x="656" y="204" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#426550">≈ as unsure as picking among 4.7</text><text x="656" y="217" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400" fill="#426550">equally likely tokens</text><text x="640" y="98" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Lower loss ⇔ lower perplexity.</text></svg>
