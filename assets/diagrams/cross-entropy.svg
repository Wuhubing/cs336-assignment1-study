<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">From logits to perplexity</title><desc id="d">Correct-token probability becomes loss, then exponentiated mean loss.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">From logits to perplexity</text><rect x="35" y="100" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="107.5" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Logits</text><rect x="204" y="100" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="276.5" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Probability</text><path d="M185 138L197 138" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="373" y="100" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="445.5" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">−log p</text><path d="M354 138L366 138" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="542" y="100" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="614.5" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Mean loss</text><path d="M523 138L535 138" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="711" y="100" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="783.5" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">exp → PPL</text><path d="M692 138L704 138" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#746d67">The target token selects one logit, but normalization uses all tokens.</text></svg>