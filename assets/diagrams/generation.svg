<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Autoregressive loop</title><desc id="d">The new token becomes part of the next prompt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker></defs><rect width="900" height="340" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="34" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Autoregressive loop</text><rect x="35" y="95" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="107.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Prompt</text><rect x="204" y="95" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="276.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Last logits</text><path d="M185 133L197 133" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="373" y="95" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="445.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Temperature</text><path d="M354 133L366 133" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="542" y="95" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="614.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Top-p</text><path d="M523 133L535 133" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="711" y="95" width="145" height="75" rx="10" fill="#fffdfa" stroke="#ded9d2" stroke-width="2"/><text x="783.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#282827">Next token</text><path d="M692 133L704 133" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><path d="M758 190V260H115V190" stroke="#50705f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="288" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#746d67">repeat until EOS or length limit</text></svg>