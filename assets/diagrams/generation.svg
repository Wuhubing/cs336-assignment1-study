<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Autoregressive decoding</title><desc id="d">The prompt passes through the model; only the last position logits are used; temperature and top-p shape the distribution; a sampled token is appended and the loop repeats.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Decode: last logits → temperature → top-p → sample → append</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Repeat until &lt;|endoftext|&gt; or the length limit. Probabilities are illustrative.</text><rect x="30" y="100" width="70" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="65" y="119.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">Once</text><rect x="106" y="100" width="70" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="141" y="119.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">␠upon</text><rect x="182" y="100" width="70" height="30" rx="5" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="217" y="119.32" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f5d8a">␠a</text><path d="M262 115L296 115" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="92" width="110" height="46" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="355" y="119" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8c1515">LM</text><path d="M412 115L446 115" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="429" y="104" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8c1515">v_T</text><text x="452" y="96" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#8c1515" letter-spacing="1.2">SOFTMAX(V / τ)</text><text x="452" y="122" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#282827">␠time</text><rect x="520" y="111" width="184" height="16" rx="3" fill="#8c1515" stroke="none" stroke-width="0"/><text x="710" y="123" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.46</text><text x="452" y="146" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#282827">␠little</text><rect x="520" y="135" width="84" height="16" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><text x="610" y="147" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.21</text><text x="452" y="170" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#282827">␠day</text><rect x="520" y="159" width="48" height="16" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><text x="574" y="171" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.12</text><text x="452" y="194" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#282827">␠cat</text><rect x="520" y="183" width="36" height="16" rx="3" fill="#cb9696" stroke="none" stroke-width="0"/><text x="562" y="195" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.09</text><text x="452" y="218" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#b1aaa3">␠very</text><rect x="520" y="207" width="24" height="16" rx="3" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="550" y="219" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.06</text><text x="452" y="242" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#b1aaa3">␠the</text><rect x="520" y="231" width="16" height="16" rx="3" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="542" y="243" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.04</text><text x="452" y="266" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#b1aaa3">…</text><rect x="520" y="255" width="8" height="16" rx="3" fill="#f2f1ef" stroke="none" stroke-width="0"/><text x="534" y="267" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#746d67">0.02</text><path d="M446 202L880 202" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880" y="196" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">top-p cut (p = 0.85)</text><path d="M600 280 L600 312 L150 312 L150 136" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#8c1515">sample “␠time”, append, run again</text><rect x="30" y="348" width="840" height="40" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="373" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">Top-p keeps the smallest set with mass ≥ p (here 0.88). τ &lt; 1 sharpens, τ &gt; 1 flattens. Report τ, p and the seed.</text></svg>
