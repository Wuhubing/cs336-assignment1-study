<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Multi-head self-attention</title><desc id="d">x is projected by W_Q, W_K, W_V; the results are split into h heads that attend independently; head outputs are concatenated and projected by W_O.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c1515"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#746d67"/></marker></defs><rect width="900" height="400" rx="14" fill="#fffdfa"/><rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#ded9d2" stroke-width="2"/><text x="30" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8c1515">Project, split into heads, attend in parallel, concatenate, project</text><text x="30" y="58" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#746d67">Shapes for one sequence with h = 4 heads, d_k = d_model / h.</text><rect x="30" y="150" width="70" height="110" rx="8" fill="#e2eaf3" stroke="none" stroke-width="0"/><text x="65" y="200" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#2f5d8a">x</text><text x="65" y="220" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f5d8a">(T, d)</text><path d="M100 205 L130 205 L130 132 L150 132" fill="none" stroke="#8c1515" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="152" y="110" width="70" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="187" y="136" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">W_Q</text><path d="M224 132L262 132" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="266" y="114" width="24" height="36" rx="3" fill="#dcb9b9" stroke="none" stroke-width="0"/><rect x="292" y="114" width="24" height="36" rx="3" fill="#c1cedc" stroke="none" stroke-width="0"/><rect x="318" y="114" width="24" height="36" rx="3" fill="#c6d1ca" stroke="none" stroke-width="0"/><rect x="344" y="114" width="24" height="36" rx="3" fill="#e9d7bc" stroke="none" stroke-width="0"/><text x="372" y="136" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">Q</text><path d="M100 205 L130 205 L130 202 L150 202" fill="none" stroke="#8c1515" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="152" y="180" width="70" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="187" y="206" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">W_K</text><path d="M224 202L262 202" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="266" y="184" width="24" height="36" rx="3" fill="#dcb9b9" stroke="none" stroke-width="0"/><rect x="292" y="184" width="24" height="36" rx="3" fill="#c1cedc" stroke="none" stroke-width="0"/><rect x="318" y="184" width="24" height="36" rx="3" fill="#c6d1ca" stroke="none" stroke-width="0"/><rect x="344" y="184" width="24" height="36" rx="3" fill="#e9d7bc" stroke="none" stroke-width="0"/><text x="372" y="206" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">K</text><path d="M100 205 L130 205 L130 272 L150 272" fill="none" stroke="#8c1515" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="152" y="250" width="70" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="187" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">W_V</text><path d="M224 272L262 272" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="266" y="254" width="24" height="36" rx="3" fill="#dcb9b9" stroke="none" stroke-width="0"/><rect x="292" y="254" width="24" height="36" rx="3" fill="#c1cedc" stroke="none" stroke-width="0"/><rect x="318" y="254" width="24" height="36" rx="3" fill="#c6d1ca" stroke="none" stroke-width="0"/><rect x="344" y="254" width="24" height="36" rx="3" fill="#e9d7bc" stroke="none" stroke-width="0"/><text x="372" y="276" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#282827">V</text><text x="318" y="310" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">split last axis</text><text x="318" y="326" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">(T, d) → (h, T, d_k)</text><path d="M392 205L432 205" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="436" y="120" width="150" height="36" rx="6" fill="#e8d0d0" stroke="#8c1515" stroke-width="1.5"/><text x="511" y="143" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#8c1515">head 1: causal attn</text><rect x="436" y="164" width="150" height="36" rx="6" fill="#d5dfe8" stroke="#2f5d8a" stroke-width="1.5"/><text x="511" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#2f5d8a">head 2: causal attn</text><rect x="436" y="208" width="150" height="36" rx="6" fill="#d9e0dc" stroke="#426550" stroke-width="1.5"/><text x="511" y="231" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#426550">head 3: causal attn</text><rect x="436" y="252" width="150" height="36" rx="6" fill="#f1e4d2" stroke="#b7791f" stroke-width="1.5"/><text x="511" y="275" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#b7791f">head 4: causal attn</text><text x="511" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#746d67">same equation, own slices</text><path d="M588 205L628 205" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="632" y="187" width="24" height="36" rx="3" fill="#dcb9b9" stroke="none" stroke-width="0"/><rect x="658" y="187" width="24" height="36" rx="3" fill="#c1cedc" stroke="none" stroke-width="0"/><rect x="684" y="187" width="24" height="36" rx="3" fill="#c6d1ca" stroke="none" stroke-width="0"/><rect x="710" y="187" width="24" height="36" rx="3" fill="#e9d7bc" stroke="none" stroke-width="0"/><text x="684" y="244" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#746d67">concat → (T, d)</text><path d="M738 205L764 205" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="766" y="183" width="56" height="44" rx="7" fill="#f0e3e0" stroke="#8c1515" stroke-width="1.5"/><text x="794" y="209" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8c1515">W_O</text><path d="M824 205L846 205" fill="none" stroke="#8c1515" stroke-width="2" marker-end="url(#arrow)"/><rect x="848" y="170" width="30" height="70" rx="5" fill="#e3ece6" stroke="none" stroke-width="0"/><text x="863" y="262" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#426550">(T, d)</text><rect x="30" y="344" width="840" height="40" rx="10" fill="#faf7f2" stroke="none" stroke-width="0"/><text x="48" y="369" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#282827">RoPE is applied to Q and K per head; the causal mask is shared by all heads. h · d_k = d_model.</text></svg>
