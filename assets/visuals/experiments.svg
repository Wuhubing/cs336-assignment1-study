<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Compare runs with learning curves</title><desc id="desc">Illustrative baseline and ablation validation-loss curves against training steps. These are schematic, not measured assignment results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="30" y="35" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">COMPARE CONTROLLED RUNS</text><path d="M65 60 V222 H445" stroke="#b5aaa0" stroke-width="2" fill="none"/><path d="M76 80 C110 160 150 170 210 181 S330 193 432 198" fill="none" stroke="#8c1515" stroke-width="4"/><path d="M76 80 C110 120 160 133 210 141 S330 155 432 161" fill="none" stroke="#477361" stroke-width="4" stroke-dasharray="7 5"/><text x="28" y="159" font-size="17" fill="#746c65" text-anchor="start" font-weight="500">loss</text><text x="403" y="246" font-size="17" fill="#746c65" text-anchor="start" font-weight="500">steps</text><text x="277" y="99" font-size="17" fill="#8c1515" text-anchor="start" font-weight="500">baseline</text><text x="277" y="127" font-size="17" fill="#477361" text-anchor="start" font-weight="500">ablation</text><text x="240" y="275" font-size="17" fill="#746c65" text-anchor="middle" font-weight="500">Schematic curves · not assignment results</text></g></svg>