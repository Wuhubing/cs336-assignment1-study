<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">A training loop connects the modules</title><desc id="desc">Sample a batch, run the model, differentiate the loss, and update weights with AdamW. Repeat, and periodically save model and optimizer state with the step.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><rect x="30" y="43" width="153" height="55" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="106" y="77" font-size="20" fill="#8c1515" text-anchor="middle" font-weight="650">Batch</text><rect x="296" y="43" width="153" height="55" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="372" y="77" font-size="20" fill="#8c1515" text-anchor="middle" font-weight="650">Forward</text><rect x="296" y="185" width="153" height="55" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="372" y="219" font-size="20" fill="#8c1515" text-anchor="middle" font-weight="650">Loss + grad</text><rect x="30" y="185" width="153" height="55" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="106" y="219" font-size="20" fill="#8c1515" text-anchor="middle" font-weight="650">AdamW</text><path d="M195 71 L284 71" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M373 111 L373 170" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M284 213 L195 213" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M106 171 L106 111" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="240" y="143" font-size="23" fill="#477361" text-anchor="middle" font-weight="500">repeat</text><text x="240" y="270" font-size="18" fill="#746c65" text-anchor="middle" font-weight="500">Save weights + optimizer + step</text></g></svg>