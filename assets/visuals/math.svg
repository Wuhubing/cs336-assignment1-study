<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Logits become a loss</title><desc id="desc">Cross-entropy uses the probability of the target token. Differentiating the loss supplies gradients for parameter updates. The bars are illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="28" y="34" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">THE TRAINING SIGNAL</text><rect x="43" y="113" width="24" height="38" rx="3" fill="#cbb8ad" stroke="none"/><rect x="81" y="94" width="24" height="57" rx="3" fill="#cbb8ad" stroke="none"/><rect x="119" y="54" width="24" height="97" rx="3" fill="#8c1515" stroke="none"/><rect x="157" y="122" width="24" height="29" rx="3" fill="#cbb8ad" stroke="none"/><text x="110" y="184" font-size="20" fill="#8c1515" text-anchor="middle" font-weight="500">Logits</text><path d="M202 108 L254 108" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="273" y="65" width="164" height="86" rx="8" fill="#e5ece6" stroke="#ddd4ca"/><text x="355" y="97" font-size="20" fill="#477361" text-anchor="middle" font-weight="650">−log p(target)</text><text x="355" y="128" font-size="17" fill="#477361" text-anchor="middle" font-weight="500">cross-entropy</text><path d="M354 164 L354 206" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="354" y="239" font-size="23" fill="#8c1515" text-anchor="middle" font-weight="500">Gradients</text><text x="29" y="252" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">Loss guides the update</text></g></svg>