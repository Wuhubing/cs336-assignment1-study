<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Merge reusable byte spans</title><desc id="desc">Schematic BPE merges: l o w becomes lo w, then low. This is a toy merge sequence, not a measured tokenizer result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="28" y="34" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">BYTE SPANS</text><rect x="43" y="51" width="52" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="69.0" y="79" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">l</text><rect x="107" y="51" width="52" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="133.0" y="79" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">o</text><rect x="171" y="51" width="52" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="197.0" y="79" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">w</text><text x="292" y="80" font-size="21" fill="#746c65" text-anchor="start" font-weight="500">3 pieces</text><path d="M133 103 L133 126" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="43" y="141" width="116" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="101.0" y="169" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">lo</text><rect x="171" y="141" width="52" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="197.0" y="169" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">w</text><text x="292" y="170" font-size="21" fill="#746c65" text-anchor="start" font-weight="500">2 pieces</text><path d="M133 193 L133 212" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="43" y="225" width="180" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="133.0" y="253" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">low</text><text x="292" y="252" font-size="21" fill="#477361" text-anchor="start" font-weight="500">1 piece</text><path d="M48 97 H153" stroke="#b58239" stroke-width="3"/></g></svg>