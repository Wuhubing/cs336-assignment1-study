<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Generate one token at a time</title><desc id="desc">A prompt Once upon a produces a next-token distribution. A sampled token such as time is appended, and the process repeats. Probabilities are illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="29" y="36" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">PROMPT → NEXT TOKEN</text><rect x="29" y="57" width="83" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="70.5" y="85" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">Once</text><rect x="123" y="57" width="83" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="164.5" y="85" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">upon</text><rect x="217" y="57" width="48" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="241.0" y="85" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">a</text><rect x="291" y="57" width="159" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="370.5" y="85" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">time</text><text x="371" y="128" font-size="18" fill="#477361" text-anchor="middle" font-weight="500">append</text><text x="30" y="163" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">time</text><rect x="93" y="148" width="157" height="19" rx="3" fill="#477361" stroke="none"/><text x="30" y="199" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">hill</text><rect x="93" y="184" width="76" height="19" rx="3" fill="#c8d6ce" stroke="none"/><text x="30" y="235" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">day</text><rect x="93" y="220" width="104" height="19" rx="3" fill="#c8d6ce" stroke="none"/><path d="M332 214 L332 150" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="356" y="205" font-size="19" fill="#8c1515" text-anchor="start" font-weight="500">sample</text><text x="93" y="274" font-size="17" fill="#746c65" text-anchor="start" font-weight="500">Illustrative next-token probabilities</text></g></svg>