<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Text becomes bytes</title><desc id="desc">A document contains A café. UTF-8 encodes A as hexadecimal 41 and é as C3 A9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><rect x="33" y="31" width="135" height="155" rx="8" fill="#ece4d6" stroke="#ddd4ca"/><rect x="45" y="43" width="135" height="155" rx="8" fill="#f2ece2" stroke="#ddd4ca"/><rect x="57" y="55" width="135" height="155" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="75" y="91" font-size="27" fill="#342f2b" text-anchor="start" font-weight="650">A café</text><rect x="75" y="112" width="94" height="5" rx="2" fill="#ded5ca"/><rect x="75" y="130" width="76" height="5" rx="2" fill="#ded5ca"/><rect x="75" y="148" width="99" height="5" rx="2" fill="#ded5ca"/><rect x="75" y="166" width="55" height="5" rx="2" fill="#ded5ca"/><path d="M205 129 L257 129" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="284" y="71" font-size="19" fill="#477361" text-anchor="start" font-weight="700">UTF-8</text><rect x="278" y="91" width="54" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="305.0" y="119" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">41</text><rect x="344" y="91" width="87" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="387.5" y="119" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">C3 A9</text><text x="305" y="163" font-size="24" fill="#746c65" text-anchor="middle" font-weight="500">A</text><text x="387" y="163" font-size="24" fill="#746c65" text-anchor="middle" font-weight="500">é</text><text x="240" y="246" font-size="20" fill="#746c65" text-anchor="middle" font-weight="500">Characters become byte sequences</text></g></svg>