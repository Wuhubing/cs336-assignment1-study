<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">Token IDs become training windows</title><desc id="desc">Illustrative IDs: input 12 48 7 3 pairs with next-token targets 48 7 3 91. Each target follows its input token in the stream.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="30" y="37" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">A TOKEN STREAM</text><rect x="30" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="60.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">12</text><rect x="102" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="132.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">48</text><rect x="174" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="204.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">7</text><rect x="246" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="276.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">3</text><rect x="318" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="348.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">91</text><rect x="390" y="52" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="420.5" y="80" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">…</text><text x="30" y="151" font-size="24" fill="#8c1515" text-anchor="start" font-weight="700">x</text><text x="30" y="214" font-size="24" fill="#477361" text-anchor="start" font-weight="700">y</text><rect x="76" y="123" width="61" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="106.5" y="151" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">12</text><rect x="148" y="123" width="61" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="178.5" y="151" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">48</text><rect x="220" y="123" width="61" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="250.5" y="151" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">7</text><rect x="292" y="123" width="61" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="322.5" y="151" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">3</text><rect x="76" y="186" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="106.5" y="214" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">48</text><rect x="148" y="186" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="178.5" y="214" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">7</text><rect x="220" y="186" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="250.5" y="214" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">3</text><rect x="292" y="186" width="61" height="43" rx="6" fill="#e5ece6" stroke="#e5ece6"/><text x="322.5" y="214" font-size="22" fill="#477361" text-anchor="middle" font-weight="650">91</text><text x="393" y="151" font-size="17" fill="#746c65" text-anchor="start" font-weight="500">input</text><text x="393" y="214" font-size="17" fill="#746c65" text-anchor="start" font-weight="500">target</text><text x="240" y="266" font-size="19" fill="#746c65" text-anchor="middle" font-weight="500">Each target is the next token</text></g></svg>