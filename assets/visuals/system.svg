<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">The whole language-model pipeline</title><desc id="desc">Text is converted to bytes, BPE produces token IDs, and a language model predicts logits. Training uses loss and parameter updates and saves checkpoints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="28" y="36" font-size="17" fill="#746c65" text-anchor="start" font-weight="700">BUILD → TRAIN → EVALUATE</text><rect x="26" y="68" width="123" height="82" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="87" y="102" font-size="26" fill="#8c1515" text-anchor="middle" font-weight="700">Text</text><text x="87" y="132" font-size="18" fill="#746c65" text-anchor="middle" font-weight="500">bytes</text><path d="M156 109 L174 109" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="183" y="68" width="123" height="82" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="244" y="102" font-size="26" fill="#8c1515" text-anchor="middle" font-weight="700">BPE</text><text x="244" y="132" font-size="18" fill="#746c65" text-anchor="middle" font-weight="500">IDs</text><path d="M313 109 L331 109" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="340" y="68" width="123" height="82" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="401" y="102" font-size="26" fill="#8c1515" text-anchor="middle" font-weight="700">LM</text><text x="401" y="132" font-size="18" fill="#746c65" text-anchor="middle" font-weight="500">logits</text><path d="M397 164 V199 H86 V165" fill="none" stroke="#477361" stroke-width="2"/><text x="240" y="237" font-size="21" fill="#477361" text-anchor="middle" font-weight="500">loss → update → checkpoint</text></g></svg>