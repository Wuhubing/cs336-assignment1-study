<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">From token IDs to logits</title><desc id="desc">IDs are embedded, pass through repeated causal Transformer blocks, final normalization, and an LM head. The causal mask only permits current and earlier positions. Output logits have shape B by T by V.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8c1515"/></marker></defs><rect width="480" height="280" rx="12" fill="#faf7f2"/><g font-family="Arial, sans-serif"><text x="28" y="34" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">(B, T)</text><text x="295" y="34" font-size="18" fill="#477361" text-anchor="start" font-weight="500">(B, T, V)</text><rect x="27" y="55" width="62" height="43" rx="6" fill="#f2e4df" stroke="#f2e4df"/><text x="58.0" y="83" font-size="22" fill="#8c1515" text-anchor="middle" font-weight="650">IDs</text><path d="M96 76 L123 76" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="133" y="52" width="138" height="48" rx="8" fill="#f2e4df" stroke="#ddd4ca"/><text x="202" y="82" font-size="19" fill="#8c1515" text-anchor="middle" font-weight="650">Embedding</text><path d="M202 103 V120 M275 202 H305 V100 H316" stroke="#8c1515" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="321" y="94" width="12" height="22" rx="2" fill="#477361" stroke="#477361"/><rect x="341" y="68" width="12" height="48" rx="2" fill="#477361" stroke="#477361"/><rect x="361" y="85" width="12" height="31" rx="2" fill="#477361" stroke="#477361"/><rect x="381" y="52" width="12" height="64" rx="2" fill="#477361" stroke="#477361"/><rect x="401" y="79" width="12" height="37" rx="2" fill="#477361" stroke="#477361"/><rect x="421" y="100" width="12" height="16" rx="2" fill="#477361" stroke="#477361"/><rect x="133" y="125" width="138" height="114" rx="8" fill="#fff" stroke="#ddd4ca"/><text x="202" y="151" font-size="16" fill="#8c1515" text-anchor="middle" font-weight="650">Causal attention</text><rect x="159" y="165" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="182" y="165" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="205" y="165" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="228" y="165" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="159" y="180" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="182" y="180" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="205" y="180" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="228" y="180" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="159" y="195" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="182" y="195" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="205" y="195" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="228" y="195" width="18" height="10" rx="2" fill="#eae6df" stroke="none"/><rect x="159" y="210" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="182" y="210" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="205" y="210" width="18" height="10" rx="2" fill="#477361" stroke="none"/><rect x="228" y="210" width="18" height="10" rx="2" fill="#477361" stroke="none"/><text x="329" y="148" font-size="20" fill="#477361" text-anchor="start" font-weight="500">Logits</text><text x="329" y="174" font-size="16" fill="#746c65" text-anchor="start" font-weight="500">per position</text><text x="27" y="270" font-size="18" fill="#746c65" text-anchor="start" font-weight="500">Repeated blocks → normalization → LM head</text></g></svg>